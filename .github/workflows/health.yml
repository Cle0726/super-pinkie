name: Code health

# M0 ratchet.  The ratchet test only compares the working tree with its own
# tools/health/baseline.json, so editing the baseline or exceptions.json in the
# same PR used to let growth through.  compare-baseline.mjs measures the PR's
# target branch with this PR's code and fails when any baseline number goes up,
# when a newly adopted number is higher than the target branch actually measures,
# or when exceptions.json / the unmeasured list gains or raises an entry (those
# are listed for the coordinator to approve one by one).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchet:
    runs-on: ${{ fromJSON(vars.PINKIE_LINUX_RUNS_ON || '"ubuntu-latest"') }}  # repo variable: '["self-hosted","linux2-docker"]' moves this job to the Linux runners; unset = GitHub-hosted
    steps:
      # Full history: compare-baseline.mjs needs the merge-base of the PR and the
      # target tip (B38).  The PR merge ref can be older than the target tip when a
      # run sits in the queue, so the target may have shrunk files the PR never
      # touched; those are judged against the merge-base, not the newer tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Ratchet and loophole counterexamples
        run: node --test --test-force-exit --import ./tests/helpers/leak-exit-check.mjs tests/code-health-ratchet.test.mjs tests/code-health-loopholes.test.mjs tests/compare-baseline-mergebase.test.mjs
      - name: Compare baseline, exceptions and unmeasured list with the target branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "refs/heads/$BASE_REF"
          git worktree add --detach "$RUNNER_TEMP/health-target" FETCH_HEAD
          node tools/health/compare-baseline.mjs --target "$RUNNER_TEMP/health-target"
