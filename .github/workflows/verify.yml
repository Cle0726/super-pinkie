name: Verify

# The release's test gate.  Node tests go through tools/release-gate, which
# fails on any failure not listed (with its reason) in known-failures.json and
# on any listed test that has started passing.  Python tests must all pass.
on:
  push:
    branches: ["fix/windows-*"]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Same historical baseline as portable-checks; generate it on Linux
      # rather than using the checked-in examples captured on another OS.
      METRE_MAIN_REFERENCE: cb7931c30ef82b7ac591bec456bd0c2bb7ee048f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF, archive and OCR tools for the learning tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils libarchive-tools tesseract-ocr
      - name: Install browser regression dependencies
        run: |
          deps="$RUNNER_TEMP/pinkie-release-verify-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps webkit
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Capture the pinned main Metre regression baseline on Linux
        run: |
          git fetch --no-tags --depth=1 origin "$METRE_MAIN_REFERENCE"
          git worktree add --detach "$RUNNER_TEMP/metre-main-reference" "$METRE_MAIN_REFERENCE"
          PINKIE_INVENTORY_SOURCE_ROOT="$RUNNER_TEMP/metre-main-reference" \
            node tools/metre/inject-inventory.mjs --save-baseline "$RUNNER_TEMP/metre-main.json"
          echo "PINKIE_METRE_MAIN_BASELINE=$RUNNER_TEMP/metre-main.json" >> "$GITHUB_ENV"
      - name: Node tests against the known-failure list
        run: node tools/release-gate/run-tests.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p '*_test.py' -v
      - name: Check the one shared UI source and Git-tracked resources
        run: python tools/ui-parity/bundle.py source --tracked
      - name: Check bundled scripts
        run: |
          find ui/injections -name '*.js' -print0 | xargs -0 -n1 node --check
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          python -m py_compile services/process_io.py services/party/server.py services/roundtable/server.py services/tts/edge_tts_server.py proxy/ur-rewrite-proxy.py app/super_pinkie.py app/windows_desktop.py tools/windows-smoke/smoke.py
