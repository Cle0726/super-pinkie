# TEMPORARY (m0 night muted text, fix/metre-night-muted): recapture real-page baselines on clean
# CI runners after 3eed7bdc / 6a5f9f97 changed Metre night sidebar text colours (only Metre-prefixed
# rules in laolao-metre-skin.css), merged with main 3f598694. Coordinator 03:58 (watch.todo): re-sample
# only the affected metre-board baselines on the merge head; every other scene must stay byte-identical,
# so the artifact holds the full capture to check the other scenes byte-for-byte against the committed set.
# Same method as tmp-m5-b6-real-baseline.yml (#97 / batch 6). The capture steps clear CI/GITHUB_ACTIONS
# only inside their own step so PINKIE_VISUAL_UPDATE is accepted there; ci.yml never does this.
# The linux job also runs a report-only compare of the synthetic set (tests/visual/baseline), which loads
# the same CSS. This file is deleted before the PR leaves draft.
name: tmp m0 night real baseline capture

on:
  push:
    branches: [fix/metre-night-muted]

jobs:
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Synthetic set compare (report only, 3x repeat)
        continue-on-error: true
        shell: bash
        env:
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: node --test --test-reporter=tap tests/visual-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/synthetic.tap"; echo "synthetic exit=${PIPESTATUS[0]}"
      - name: Compare committed linux set first (strict, expected red only on metre-board)
        continue-on-error: true
        shell: bash
        env:
          PINKIE_VISUAL_REPORT: "1"
        run: node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/compare.tap"; echo "compare exit=${PIPESTATUS[0]}"
      - name: Capture linux real baselines (3x repeat, 0 px jitter required)
        shell: bash
        run: |
          set +e
          rm -rf tests/visual/diff-real
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
      - name: Re-check linux set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
      - name: Collect logs
        if: always()
        shell: bash
        run: mkdir -p tmp-m0-logs && cp "$RUNNER_TEMP"/*.tap tmp-m0-logs/ 2>/dev/null; ls tmp-m0-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-night-real-baseline-linux
          path: |
            tests/visual/real-baseline/linux
            tests/visual/diff-real
            tests/visual/diff
            tmp-m0-logs
          if-no-files-found: warn

  windows-capture:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright pinned Chromium
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install playwright' }
          & (Join-Path $deps 'node_modules/.bin/playwright.cmd') install chromium-headless-shell
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Chromium' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compare committed win32 set first (strict, expected red only on metre-board)
        continue-on-error: true
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPORT: "1"
        run: node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/compare.tap"; echo "compare exit=${PIPESTATUS[0]}"
      - name: Capture win32 real baselines (3x repeat, 0 px jitter required)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          rm -rf tests/visual/diff-real
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
      - name: Re-check win32 set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
      - name: Collect logs
        if: always()
        shell: bash
        run: mkdir -p tmp-m0-logs && cp "$RUNNER_TEMP"/*.tap tmp-m0-logs/ 2>/dev/null; ls tmp-m0-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-night-real-baseline-win32
          path: |
            tests/visual/real-baseline/win32
            tests/visual/diff-real
            tmp-m0-logs
          if-no-files-found: warn
