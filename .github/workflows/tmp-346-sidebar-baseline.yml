# TEMPORARY (PR #346, B11 daytime sidebar group title / count / time ink): re-capture the real-page baselines
# that #346 changes, on clean CI runners, the same way #113 / #237 / #294 / #356 did.
# The capture runs the unchanged suite in update mode (all scenes are written); the whole
# tests/visual/real-baseline/<os>/ folder is uploaded so only scenes whose diff lies inside the sidebar
# box are committed by hand. Thresholds and harness are untouched. The capture steps clear
# CI/GITHUB_ACTIONS only inside their own step so that PINKIE_VISUAL_UPDATE is accepted there;
# ci.yml never does this. This file is deleted from the branch right after the capture.
name: tmp 346 sidebar baseline capture

on:
  push:
    branches: [win/b11-learning-sidebar-ink]

jobs:
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Strict compare against the committed linux set first (shows which scenes #346 moves)
        shell: bash
        env:
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"; echo "before exit=${PIPESTATUS[0]}"
          mkdir -p "$RUNNER_TEMP/diff-before" && cp -r tests/visual/diff-real/. "$RUNNER_TEMP/diff-before/" 2>/dev/null || true
      - name: Capture linux real baselines (3x repeat, 0 px jitter required)
        shell: bash
        run: |
          set +e
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          git status --short tests/visual/real-baseline/linux
          sha256sum tests/visual/real-baseline/linux/*.png
      - name: Re-check linux set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
          cp "$RUNNER_TEMP"/*.tap tests/visual/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-346-sidebar-baseline-linux
          path: |
            tests/visual/real-baseline/linux
            tests/visual/diff-real
            tests/visual/*.tap
            ${{ runner.temp }}/diff-before
          if-no-files-found: warn

  windows-capture:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright pinned Chromium
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install playwright' }
          & (Join-Path $deps 'node_modules/.bin/playwright.cmd') install chromium-headless-shell
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Chromium' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Strict compare against the committed win32 set first (shows which scenes #346 moves)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"; echo "before exit=${PIPESTATUS[0]}"
          mkdir -p "$RUNNER_TEMP/diff-before" && cp -r tests/visual/diff-real/. "$RUNNER_TEMP/diff-before/" 2>/dev/null || true
      - name: Capture win32 real baselines (3x repeat, 0 px jitter required)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          git status --short tests/visual/real-baseline/win32
          sha256sum tests/visual/real-baseline/win32/*.png
      - name: Re-check win32 set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
          cp "$RUNNER_TEMP"/*.tap tests/visual/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-346-sidebar-baseline-win32
          path: |
            tests/visual/real-baseline/win32
            tests/visual/diff-real
            tests/visual/*.tap
            ${{ runner.temp }}/diff-before
          if-no-files-found: warn
