# TEMPORARY (PR #424 B11 #261 #6): the composer's project-scope label goes 9px -> 11px with a darker day colour, so
# the project-mode real scenes (home-project, long-conversation, model-picker, sidebar-*) differ from their baselines.
# win-coord on #424: re-capture only the affected baselines if the diff is confined to the label; stop and report otherwise.
# This run first keeps the strict-compare diff/actual images for inspection, then captures candidates (3x repeat, 0 px
# jitter) and re-checks them in a fresh process. Nothing is committed from here automatically: only the scenes whose
# diff is confirmed to be the label are taken from the artifact by hand. Same procedure as tmp-414-lcday-baseline.yml;
# the capture step clears CI/GITHUB_ACTIONS only inside its own step. This file is deleted from the branch afterwards.
name: tmp 424 project-scope baseline diagnose + capture

on:
  push:
    branches: [fix/b11-project-scope-text]

jobs:
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies (same as portable-checks)
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps webkit chromium
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Strict compare against current linux baselines (keep diff + actual images)
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"
          echo "before exit=${PIPESTATUS[0]}"
          mkdir -p before-diff && cp -r tests/visual/diff-real/. before-diff/ 2>/dev/null; ls -la before-diff
      - name: Capture linux real baselines (3x repeat, 0 px jitter required)
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          rm -rf tests/visual/diff-real
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          git status --short tests/visual/real-baseline/
          sha256sum tests/visual/real-baseline/linux/*.png
      - name: Re-check linux set in a fresh process (strict compare, 3x repeat)
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-424-scope-baseline-linux
          path: |
            tests/visual/real-baseline/linux/
            before-diff
            tests/visual/diff-real
          if-no-files-found: warn

  windows-capture:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright pinned Chromium
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install playwright' }
          & (Join-Path $deps 'node_modules/.bin/playwright.cmd') install chromium-headless-shell
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Chromium' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Strict compare against current win32 baselines (keep diff + actual images)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"
          echo "before exit=${PIPESTATUS[0]}"
          mkdir -p before-diff && cp -r tests/visual/diff-real/. before-diff/ 2>/dev/null; ls -la before-diff
      - name: Capture win32 real baselines (3x repeat, 0 px jitter required)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          rm -rf tests/visual/diff-real
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          git status --short tests/visual/real-baseline/
          sha256sum tests/visual/real-baseline/win32/*.png
      - name: Re-check win32 set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-424-scope-baseline-win32
          path: |
            tests/visual/real-baseline/win32/
            before-diff
            tests/visual/diff-real
          if-no-files-found: warn
