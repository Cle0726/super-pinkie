# TEMPORARY (winflake line): diagnose the flaky study-desk browser e2e files on
# windows-latest. Removed again before the final commit of maint/win-checks-flakes.
name: tmp winflake e2e repeat

on:
  workflow_dispatch:
  push:
    branches: [maint/win-checks-flakes]

jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Install browser regression dependencies
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install browser test dependencies' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Probe compositor load on the study desk
        timeout-minutes: 10
        shell: bash
        run: node .github/tmp-winflake-probe.mjs
