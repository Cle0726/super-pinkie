name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  METRE_MAIN_REFERENCE: cb7931c30ef82b7ac591bec456bd0c2bb7ee048f

jobs:
  portable-checks:
    runs-on: ${{ fromJSON(vars.PINKIE_LINUX_RUNS_ON || '"ubuntu-latest"') }}  # repo variable: '["self-hosted","linux2-docker"]' moves this job to the Linux runners; unset = GitHub-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser regression dependencies
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps webkit chromium
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Verify M5 visual baseline 3x determinism and <=0.1% diff on Linux Chromium
        env:
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: node --test tests/visual-baseline.test.mjs
      - name: Capture the pinned main Metre regression baseline on Linux
        run: |
          git fetch --no-tags --depth=1 origin "$METRE_MAIN_REFERENCE"
          git worktree add --detach "$RUNNER_TEMP/metre-main-reference" "$METRE_MAIN_REFERENCE"
          PINKIE_INVENTORY_SOURCE_ROOT="$RUNNER_TEMP/metre-main-reference" \
            node tools/metre/inject-inventory.mjs --save-baseline "$RUNNER_TEMP/metre-main.json"
          echo "PINKIE_METRE_MAIN_BASELINE=$RUNNER_TEMP/metre-main.json" >> "$GITHUB_ENV"
      - name: Check JavaScript injections
        run: find ui/injections -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run all execution, recovery, UI and desktop regression tests
        timeout-minutes: 30
        run: |
          node --test tests/*.test.cjs tests/*.test.mjs
          python -m unittest discover -s tests -p '*_test.py' -v
          node --check ui/party/party.js
          node --check ui/party/party-drafts.js
      - name: Check shell scripts
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Check Python services
        run: python -m py_compile services/process_io.py services/party/server.py services/roundtable/server.py services/tts/edge_tts_server.py proxy/ur-rewrite-proxy.py app/super_pinkie.py app/windows_desktop.py
      - name: Confirm personality files are present
        run: |
          test -s personas/chat/SOUL.md && test -s personas/project/SOUL.md && test -s personas/thinking/SOUL.md && test -s personas/neutral/SOUL.md
          grep -Fq '不加「先生」「老板」这类头衔' personas/project/SOUL.md
          grep -Fq '工程搭档' personas/project/SOUL.md
          grep -Fq '每个新会话都重新完整读取它的 `SKILL.md`' personas/project/AGENTS.md
      - name: Confirm four-mode UI assets are present
        run: |
          test -s ui/assets/laolao-mode-project-hd.png
          test -s ui/assets/laolao-mode-project.svg
          test -s ui/assets/laolao-mode-transition-project.png
          test -s ui/assets/laolao-wallpaper-project.png
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('ui/injections/laolao-mode-switcher.js', 'utf8');
          const ids = ['chat', 'project', 'thinking', 'unrestricted'];
          const positions = ids.map((id) => source.indexOf(`id: "${id}"`));
          if (positions.some((position) => position < 0)) throw new Error('missing mode');
          if (positions.some((position, index) => index > 0 && position <= positions[index - 1])) {
            throw new Error('mode order changed');
          }
          NODE

  macos-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Type-check native launcher
        run: |
          src=desktop/macos/pinkie/Sources
          xcrun swiftc -parse-as-library -typecheck \
            "$src/MaterialPreview.swift" "$src/BrowserControl.swift" \
            "$src/ChatGPTBackgroundWorker.swift" "$src/PinkieNative.swift" \
            "$src/LauncherRuntime.swift" "$src/LauncherViews.swift" \
            "$src/LauncherServices.swift" "$src/LauncherBrowser.swift" \
            "$src/LauncherWorkspace.swift" "$src/LauncherWebBridge.swift" \
            "$src/AppWindow.swift" "$src/Launcher.swift" \
            -framework AppKit -framework AVFoundation -framework Carbon \
            -framework Foundation -framework Speech -framework UserNotifications \
            -framework WebKit
      - name: Verify self-contained bundle contract
        run: node --test tests/self-contained-app.test.cjs tests/native-glass.test.cjs tests/macos-ci-contract.test.cjs
      - name: Install WebKit regression dependencies
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install webkit
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Verify tool image trace and Metre sidebar in WebKit on macOS
        timeout-minutes: 5
        env:
          PINKIE_IMAGE_UI_ENGINE: webkit
        run: node --test --test-concurrency=1 tests/tool-images-e2e.test.mjs tests/metre-sidebar-e2e.test.mjs tests/metre-switch-e2e.test.mjs

  windows-build:
    needs: [portable-checks, macos-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows .exe
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('.\installer\windows\apply-theme.ps1', '.\install.ps1', '.\services\watchdog\windows-gateway-watchdog.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax check failed' }
          .\build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: super-pinkie-windows
          if-no-files-found: error
          path: |
            dist/超級碧琪/
            dist/超級碧琪.exe

  windows-checks:
    # This app ships on Windows, but no job here used to run the suites there:
    # portable-checks covers ubuntu and macos-check covers two node files, while
    # windows-build only produces the artifact.  Windows-only defects were
    # therefore invisible until a user hit them, and they are not theoretical:
    # the audit lock reports EPERM on a lost `open(..., 'wx')` race where Linux
    # reports EEXIST, so a concurrent writer dropped records, and the
    # project-scope tests failed on Windows for POSIX-only reasons
    # (/bin/sh, JSON-escaped paths).  Run the same suites a Windows user runs.
    #
    # Deliberately not gated behind the other jobs: the whole point is an early,
    # unambiguous Windows signal, and waiting for two other runners plus a
    # three-minute build before learning about a Windows failure defeats it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser regression dependencies
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install browser test dependencies' }
          # chromium-headless-shell: the pinned Playwright Chromium the real-page
          # visual/hotspot suites capture with (same revision as portable-checks).
          & (Join-Path $deps 'node_modules/.bin/playwright.cmd') install webkit chromium-headless-shell
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install WebKit / Chromium for browser tests' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify tool image trace and Metre sidebar in Chrome on Windows
        timeout-minutes: 5
        env:
          PINKIE_IMAGE_UI_ENGINE: chromium
        run: node --test tests/tool-images-e2e.test.mjs tests/metre-sidebar-e2e.test.mjs tests/metre-switch-e2e.test.mjs
      - name: Run the execution, recovery, UI and desktop suites on Windows
        timeout-minutes: 30
        # bash keeps this step identical to portable-checks: the default shell
        # here is PowerShell, which does not expand globs for native commands.
        # Node expands them itself, but matching the ubuntu job exactly removes
        # a whole class of "does this differ by shell" doubt.
        #
        # PYTHONUTF8 pins the interpreter to UTF-8 mode: the test suites were
        # written for a UTF-8 environment (Linux/macOS) and read/write Chinese
        # files via Path.read_text()/write_text() without an explicit encoding,
        # which the stock Windows runner's cp1252 locale then chokes on.  The
        # product code already pins encoding='utf-8' explicitly for end users;
        # the suites run only here, so fixing the environment is the correct,
        # single-place remedy for them.
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # Browser-heavy files launch real Chrome and WebKit concurrently.
          # On the small Windows runner, an input click and a desk mount timed
          # out under the default process fan-out. Run every file, but bound
          # the number of processes instead of extending those test deadlines.
          # Both suites still run even if the other fails.
          status=0
          node --test --test-concurrency=2 tests/*.test.cjs tests/*.test.mjs || status=1
          python -m unittest discover -s tests -p '*_test.py' -v || status=1
          exit $status
      - name: Check Python services
        shell: bash
        run: python -m py_compile services/process_io.py services/party/server.py services/roundtable/server.py services/tts/edge_tts_server.py proxy/ur-rewrite-proxy.py app/super_pinkie.py app/windows_desktop.py

  cle-core-checks:
    name: C.le. 内核
    # Fork pull requests never receive secrets. Everywhere else this job fails closed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PINKIE_CORE: cle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate core-manifest.json for C.le.
        run: node tools/core/manifest.mjs info --core cle
      # The token exists only in this step; install scripts and patches never see it.
      - name: Download C.le. core tarball (SHA-256)
        env:
          CLE_CORE_TOKEN: ${{ secrets.CLE_CORE_TOKEN }}
        run: |
          if [[ -z "${CLE_CORE_TOKEN:-}" ]]; then
            echo "::error::CLE_CORE_TOKEN is not configured, so the C.le. core cannot be tested."
            exit 1
          fi
          tgz="$(node tools/core/manifest.mjs fetch-cle --cache-dir "$RUNNER_TEMP/core-cache")"
          echo "PINKIE_CLE_CORE_TARBALL=$tgz" >> "$GITHUB_ENV"
      - name: Prove C.le. equals npm openclaw before and after Pinkie patches
        env:
          PINKIE_NPM_REGISTRY: https://registry.npmjs.org
        run: |
          official="$RUNNER_TEMP/openclaw-prefix"
          cle="$RUNNER_TEMP/cle-core-prefix"
          node tools/core/manifest.mjs install --core openclaw --prefix "$official"
          node tools/core/manifest.mjs install --core cle --prefix "$cle"
          node tools/core/verify-equivalence.mjs --openclaw-prefix "$official" --cle-prefix "$cle"
          node tools/core/verify-cle-patches.mjs --openclaw-root "$official/node_modules/openclaw"
          node tools/core/verify-cle-patches.mjs --openclaw-root "$cle/node_modules/openclaw"
          node tools/core/verify-equivalence.mjs --openclaw-prefix "$official" --cle-prefix "$cle"
      - name: Install browser regression dependencies
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps webkit chromium
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Verify M5 visual baseline on C.le. core path (3x determinism, <=0.1% diff)
        env:
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: node --test tests/visual-baseline.test.mjs
      - name: Run core-manifest, Metre inventory, and full regression suites on C.le. path
        timeout-minutes: 30
        run: |
          git fetch --no-tags --depth=1 origin "$METRE_MAIN_REFERENCE"
          git worktree add --detach "$RUNNER_TEMP/metre-main-reference" "$METRE_MAIN_REFERENCE"
          PINKIE_INVENTORY_SOURCE_ROOT="$RUNNER_TEMP/metre-main-reference" \
            node tools/metre/inject-inventory.mjs --save-baseline "$RUNNER_TEMP/metre-main.json"
          PINKIE_METRE_MAIN_BASELINE="$RUNNER_TEMP/metre-main.json" \
            node --test tests/*.test.cjs tests/*.test.mjs
          python -m unittest discover -s tests -p '*_test.py' -v
