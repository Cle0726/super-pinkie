name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript injections
        run: find ui/injections -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run all execution, recovery, UI and desktop regression tests
        run: |
          node --test tests/*.test.cjs tests/*.test.mjs
          python -m unittest discover -s tests -p '*_test.py' -v
          node --check ui/party/party.js
          node --check ui/party/party-drafts.js
      - name: Check shell scripts
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Check Python services
        run: python -m py_compile services/process_io.py services/party/server.py services/roundtable/server.py services/tts/edge_tts_server.py proxy/ur-rewrite-proxy.py app/super_pinkie.py app/windows_desktop.py
      - name: Confirm personality files are present
        run: |
          test -s personas/chat/SOUL.md && test -s personas/project/SOUL.md && test -s personas/thinking/SOUL.md && test -s personas/neutral/SOUL.md
          grep -Fq '始终称呼用户为“老板”' personas/project/SOUL.md
          grep -Fq '每个新会话都重新定位并完整读取本次所需 Skill' personas/project/SOUL.md
      - name: Confirm four-mode UI assets are present
        run: |
          test -s ui/assets/laolao-mode-project-hd.png
          test -s ui/assets/laolao-mode-project.svg
          test -s ui/assets/laolao-mode-transition-project.png
          test -s ui/assets/laolao-wallpaper-project.png
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('ui/injections/laolao-mode-switcher.js', 'utf8');
          const ids = ['chat', 'project', 'thinking', 'unrestricted'];
          const positions = ids.map((id) => source.indexOf(`id: "${id}"`));
          if (positions.some((position) => position < 0)) throw new Error('missing mode');
          if (positions.some((position, index) => index > 0 && position <= positions[index - 1])) {
            throw new Error('mode order changed');
          }
          NODE

  macos-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Type-check native launcher
        run: |
          xcrun swiftc -parse-as-library -typecheck \
            desktop/macos/Sources/Launcher.swift \
            -framework AppKit -framework AVFoundation -framework Foundation \
            -framework Speech -framework WebKit
      - name: Verify self-contained bundle contract
        run: node --test tests/self-contained-app.test.cjs tests/native-glass.test.cjs

  windows-build:
    needs: [portable-checks, macos-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows .exe
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('.\installer\windows\apply-theme.ps1', '.\install.ps1', '.\services\watchdog\windows-gateway-watchdog.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax check failed' }
          .\build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: super-pinkie-windows
          if-no-files-found: error
          path: |
            dist/超級碧琪/
            dist/超級碧琪.exe

  windows-checks:
    # This app ships on Windows, but no job here used to run the suites there:
    # portable-checks covers ubuntu and macos-check covers two node files, while
    # windows-build only produces the artifact.  Windows-only defects were
    # therefore invisible until a user hit them, and they are not theoretical:
    # the audit lock reports EPERM on a lost `open(..., 'wx')` race where Linux
    # reports EEXIST, so a concurrent writer dropped records, and the
    # project-scope tests failed on Windows for POSIX-only reasons
    # (/bin/sh, JSON-escaped paths).  Run the same suites a Windows user runs.
    #
    # Deliberately not gated behind the other jobs: the whole point is an early,
    # unambiguous Windows signal, and waiting for two other runners plus a
    # three-minute build before learning about a Windows failure defeats it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the execution, recovery, UI and desktop suites on Windows
        # bash keeps this step identical to portable-checks: the default shell
        # here is PowerShell, which does not expand globs for native commands.
        # Node expands them itself, but matching the ubuntu job exactly removes
        # a whole class of "does this differ by shell" doubt.
        #
        # PYTHONUTF8 pins the interpreter to UTF-8 mode: the test suites were
        # written for a UTF-8 environment (Linux/macOS) and read/write Chinese
        # files via Path.read_text()/write_text() without an explicit encoding,
        # which the stock Windows runner's cp1252 locale then chokes on.  The
        # product code already pins encoding='utf-8' explicitly for end users;
        # the suites run only here, so fixing the environment is the correct,
        # single-place remedy for them.
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          node --test tests/*.test.cjs tests/*.test.mjs
          python -m unittest discover -s tests -p '*_test.py' -v
      - name: Check Python services
        shell: bash
        run: python -m py_compile services/process_io.py services/party/server.py services/roundtable/server.py services/tts/edge_tts_server.py proxy/ur-rewrite-proxy.py app/super_pinkie.py app/windows_desktop.py
