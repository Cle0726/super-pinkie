name: Release candidate

# Builds the real user (release-channel) packages — guard on, manifest signed
# with the release key, release splash. Windows also runs fresh + upgrade smoke.
# Nothing is published: no GitHub release, no latest.json, no mirror.
# Push a release/** branch (or run it by hand) before tagging a version.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      old_tag:
        description: "Current user version to upgrade from"
        default: v2.5.49

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require 碧琪-voice release notes for this version (docs/RELEASE-NOTES.md)
        run: python3 tools/release/release_notes.py check "v$(tr -d '[:space:]' < VERSION)"

  macos-release-package:
    # Use the same runner, runtime inputs and release build as release.yml.
    # Verify packaging without a tag; do not upload a public release asset.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bundled runtime inputs
        run: |
          version="$(python3 -c 'import json; print(json.load(open("desktop/windows/runtime-manifest.json"))["openclaw"])')"
          npm install -g "openclaw@$version"
          python3 -m pip install --disable-pip-version-check edge-tts aiohttp
      - name: Build the release-channel macOS package (not published)
        shell: bash
        env:
          PINKIE_GUARD_SIGNING_KEY: ${{ secrets.PINKIE_GUARD_SIGNING_KEY }}
          PINKIE_FEEDBACK_TOKEN: ${{ secrets.PINKIE_FEEDBACK_TOKEN }}
          PINKIE_FEEDBACK_PUBLIC_KEY: ${{ secrets.PINKIE_FEEDBACK_PUBLIC_KEY || vars.PINKIE_FEEDBACK_PUBLIC_KEY }}
          PINKIE_FEEDBACK_REPO: ${{ vars.PINKIE_FEEDBACK_REPO || secrets.PINKIE_FEEDBACK_REPO }}
          PINKIE_FEEDBACK_RELAY_URL: ${{ vars.PINKIE_FEEDBACK_RELAY_URL || secrets.PINKIE_FEEDBACK_RELAY_URL }}
        run: |
          if [[ -z "$PINKIE_GUARD_SIGNING_KEY" ]]; then
            echo "缺少仓库 secret PINKIE_GUARD_SIGNING_KEY，正式版不能打包" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/guard-signing-key.pem"
          umask 077
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$PINKIE_GUARD_SIGNING_KEY" > "$key_file"
          unset PINKIE_GUARD_SIGNING_KEY
          PINKIE_RELEASE_BUILD=1 PINKIE_GUARD_SIGNING_KEY_FILE="$key_file" ./desktop/macos/build.sh
      - name: Verify the Mac release ZIP, channel, guard signature and opening assets
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          resources="超級碧琪.app/Contents/Resources/SuperPinkie"
          archive="dist/super-pinkie-macos-$version.zip"
          python3 - "$archive" "$resources" <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZipFile

          archive, resources = argv[1:]
          expected = {name: Path('dist', resources, name) for name in (
              'build-info.json', 'guard-manifest.json', 'guard-manifest.sig',
          )}
          expected['ui/assets/laolao-splash.mp4'] = Path('ui/assets/laolao-splash-release.mp4')
          expected['ui/assets/laolao-splash-video-poster.png'] = Path('ui/assets/laolao-splash-video-poster-release.png')
          with ZipFile(archive, metadata_encoding='utf-8') as package:
              for name, source in expected.items():
                  if package.read(f'{resources}/{name}') != source.read_bytes():
                      raise SystemExit(f'Mac release archive differs from expected file: {name}')
          PY
          node --input-type=module - "dist/$resources" "$version" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { bundleTrust } from './installer/guard/guard.mjs';
          const [root, version] = process.argv.slice(2);
          const { guard, channel, commit, version: packagedVersion } = JSON.parse(readFileSync(`${root}/build-info.json`, 'utf8'));
          assert.equal(guard, true);
          assert.equal(channel, 'release');
          assert.equal(commit, process.env.GITHUB_SHA);
          assert.equal(packagedVersion, version);
          const trusted = bundleTrust(root, {});
          assert.equal(trusted.ok, true, trusted.reason);
          assert.equal(trusted.how, 'manifest');
          assert.equal(trusted.manifest.commit, commit);
          assert.equal(trusted.manifest.version, version);
          console.log(`Mac release archive OK: ${version} @ ${commit}`);
          NODE

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release-channel Windows package (not published)
        shell: pwsh
        env:
          PINKIE_GUARD_SIGNING_KEY: ${{ secrets.PINKIE_GUARD_SIGNING_KEY }}
          PINKIE_FEEDBACK_TOKEN: ${{ secrets.PINKIE_FEEDBACK_TOKEN }}
          PINKIE_FEEDBACK_PUBLIC_KEY: ${{ secrets.PINKIE_FEEDBACK_PUBLIC_KEY || vars.PINKIE_FEEDBACK_PUBLIC_KEY }}
          PINKIE_FEEDBACK_REPO: ${{ vars.PINKIE_FEEDBACK_REPO || secrets.PINKIE_FEEDBACK_REPO }}
          PINKIE_FEEDBACK_RELAY_URL: ${{ vars.PINKIE_FEEDBACK_RELAY_URL || secrets.PINKIE_FEEDBACK_RELAY_URL }}
        run: |
          if (-not $env:PINKIE_GUARD_SIGNING_KEY) { throw '缺少仓库 secret PINKIE_GUARD_SIGNING_KEY，正式版不能打包' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'guard-signing-key.pem'
          [System.IO.File]::WriteAllText($keyFile, $env:PINKIE_GUARD_SIGNING_KEY + "`n")
          $env:PINKIE_RELEASE_BUILD = '1'
          $env:PINKIE_GUARD_SIGNING_KEY_FILE = $keyFile
          try { .\build-win.ps1 } finally { Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue }
      - name: Pack the portable zip for hand checks
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          Compress-Archive -Path 'dist\超級碧琪' -DestinationPath "dist\super-pinkie-windows-$version-rc-portable.zip" -Force
      - name: Keep the onedir for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir
          path: dist/超級碧琪
          retention-days: 3
      - name: Keep the candidate portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-rc-portable
          path: dist/super-pinkie-windows-*-rc-portable.zip
          retention-days: 7

  windows-smoke:
    needs: windows
    uses: ./.github/workflows/windows-smoke.yml
    with:
      app_artifact: windows-onedir
      old_tag: ${{ inputs.old_tag || 'v2.5.49' }}
