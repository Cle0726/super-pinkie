# TEMPORARY (PR #414 B11 T6): the day --cle-mute change darkens the process-card status line, so
# win32 real-scene long-conversation-day differs from its baseline only in x=432..602 y=358..371.
# win-coord approved (a) minimal re-capture on #414 (comment 7211105883): ONLY
# tests/visual/real-baseline/win32/long-conversation-day.png is taken from the artifact and committed
# by hand; linux passed and is not re-captured; night baselines, thresholds and harness are untouched.
# Same procedure as tmp-346-settings-baseline.yml (removed in 418218d0): the capture step clears
# CI/GITHUB_ACTIONS only inside its own step so that PINKIE_VISUAL_UPDATE is accepted there;
# ci.yml never does this. This file is deleted from the branch right after the capture.
name: tmp 414 long-conversation-day baseline capture

on:
  push:
    branches: [mac/b11-t6-cle-status-contrast]

jobs:
  windows-capture:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright pinned Chromium
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install playwright' }
          & (Join-Path $deps 'node_modules/.bin/playwright.cmd') install chromium-headless-shell
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Chromium' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Strict compare against current win32 baselines (expected red on long-conversation-day only)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"
          echo "before exit=${PIPESTATUS[0]}"
          sha256sum tests/visual/real-baseline/win32/long-conversation-day.png
          mkdir -p before-diff && cp -r tests/visual/diff-real/. before-diff/ 2>/dev/null; ls -la before-diff
      - name: Capture win32 real baselines (3x repeat, 0 px jitter required)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          rm -rf tests/visual/diff-real
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          sha256sum tests/visual/real-baseline/win32/long-conversation-day.png
          git status --short tests/visual/real-baseline/
      - name: Re-check win32 set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-414-lcday-baseline-win32
          path: |
            tests/visual/real-baseline/win32/long-conversation-day.png
            before-diff
            tests/visual/diff-real
          if-no-files-found: warn
