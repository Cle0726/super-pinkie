# TEMPORARY (B73, ui4): re-capture exactly four real-page baselines that main outgrew through
# already-reviewed appearance merges (#414 laolao-cle-stage.css; #399 + #349 stacked on home):
#   linux/long-conversation-day, linux/long-conversation-night,
#   win32/long-conversation-night, win32/home-project-day.
# Same method as #414 (tmp-414-lcday-baseline.yml) / #346: strict compare first (keep the
# pre-change diffs), then capture in update mode with 3x repeat (0 px jitter required), then a
# strict re-check in a fresh process. The suite writes every scene in update mode, but only the
# four files above are taken from the artifacts and committed by hand. Thresholds, harness and
# all other baselines stay untouched. CI/GITHUB_ACTIONS are cleared only inside the capture step
# so that PINKIE_VISUAL_UPDATE is accepted there. This file is deleted in the same commit that
# swaps the baselines.
name: tmp b73 rebaseline capture

on:
  push:
    branches: [win/b73-real-rebaseline]

jobs:
  linux-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          deps="$RUNNER_TEMP/pinkie-ci-deps"
          version="$(node -p "require('./tools/pinkie-toolbox/toolbox-manifest.json').playwrightVersion")"
          npm install --prefix "$deps" --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
      - name: Strict compare before capture (keep pre-change diffs)
        shell: bash
        env:
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"
          echo "before exit=${PIPESTATUS[0]}"
          grep -E 'real-page visual diff' "$RUNNER_TEMP/before.tap" | sort -u | cut -c1-260
          mkdir -p tests/visual/pre-diff
          cp -r tests/visual/diff-real/. tests/visual/pre-diff/ 2>/dev/null
          cp "$RUNNER_TEMP/before.tap" tests/visual/pre-diff/before.tap
          rm -rf tests/visual/diff-real
      - name: Capture linux real baselines (3x repeat, 0 px jitter required)
        shell: bash
        run: |
          set +e
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          sha256sum tests/visual/real-baseline/linux/long-conversation-*.png
          git status --short tests/visual/real-baseline
      - name: Re-check linux set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
          cp "$RUNNER_TEMP/capture.tap" "$RUNNER_TEMP/recheck.tap" tests/visual/pre-diff/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-b73-rebaseline-linux
          path: |
            tests/visual/real-baseline/linux
            tests/visual/pre-diff
            tests/visual/diff-real
          if-no-files-found: warn

  windows-capture:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright pinned Chromium
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'pinkie-ci-deps'
          $version = (Get-Content 'tools/pinkie-toolbox/toolbox-manifest.json' -Raw | ConvertFrom-Json).playwrightVersion
          npm install --prefix $deps --no-save --no-package-lock "playwright@$version" "ws@8.23.0"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install playwright' }
          & (Join-Path $deps 'node_modules/.bin/playwright.cmd') install chromium-headless-shell
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Chromium' }
          "NODE_PATH=$(Join-Path $deps 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Strict compare before capture (keep pre-change diffs)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          set +e
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/before.tap"
          echo "before exit=${PIPESTATUS[0]}"
          grep -E 'real-page visual diff' "$RUNNER_TEMP/before.tap" | sort -u | cut -c1-260
          mkdir -p tests/visual/pre-diff
          cp -r tests/visual/diff-real/. tests/visual/pre-diff/ 2>/dev/null
          cp "$RUNNER_TEMP/before.tap" tests/visual/pre-diff/before.tap
          rm -rf tests/visual/diff-real
      - name: Capture win32 real baselines (3x repeat, 0 px jitter required)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          env -u CI -u GITHUB_ACTIONS PINKIE_VISUAL_UPDATE=1 PINKIE_VISUAL_REPEAT=3 PINKIE_VISUAL_REPORT=1 \
            node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/capture.tap"
          echo "capture exit=${PIPESTATUS[0]}"
          sha256sum tests/visual/real-baseline/win32/long-conversation-night.png tests/visual/real-baseline/win32/home-project-day.png
          git status --short tests/visual/real-baseline
      - name: Re-check win32 set in a fresh process (strict compare, 3x repeat)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PINKIE_VISUAL_REPEAT: "3"
          PINKIE_VISUAL_REPORT: "1"
        run: |
          rm -rf tests/visual/diff-real
          node --test --test-reporter=tap tests/visual-real-baseline.test.mjs 2>&1 | tee "$RUNNER_TEMP/recheck.tap"; echo "recheck exit=${PIPESTATUS[0]}"
          cp "$RUNNER_TEMP/capture.tap" "$RUNNER_TEMP/recheck.tap" tests/visual/pre-diff/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-b73-rebaseline-win32
          path: |
            tests/visual/real-baseline/win32
            tests/visual/pre-diff
            tests/visual/diff-real
          if-no-files-found: warn
