name: build-apps

on:
  # Legacy lightweight control-app build. Production releases are created by
  # release.yml so two workflows never race to publish different macOS apps.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS .app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build .app
        run: pyinstaller --noconfirm --windowed --name "超級碧琪" --add-data "prompts:prompts" --add-data "proxy/ur-rewrite-proxy.py:proxy" --osx-bundle-identifier "com.cle0726.superpinkie" app/super_pinkie.py
      - name: Pack .app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/超級碧琪.app" "dist/super-pinkie-control-macos.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 超級碧琪-macos
          path: dist/super-pinkie-control-macos.zip

  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The token exists only in this step; build scripts and patches never see it.
      - name: Download C.le. core tarball (SHA-256)
        shell: bash
        env:
          CLE_CORE_TOKEN: ${{ secrets.CLE_CORE_TOKEN }}
        run: |
          if [[ "$(node tools/core/manifest.mjs field core)" == "cle" ]]; then
            if [[ -z "${CLE_CORE_TOKEN:-}" ]]; then
              echo "::error::CLE_CORE_TOKEN is not configured, so the C.le. core cannot be packaged."
              exit 1
            fi
            tgz="$(node tools/core/manifest.mjs fetch-cle --cache-dir "$RUNNER_TEMP/core-cache")"
            printf 'PINKIE_CLE_CORE_TARBALL=%s\n' "$tgz" >> "$GITHUB_ENV"
          fi
      - name: Build .exe
        shell: pwsh
        run: .\build-win.ps1 -LegacyOneFile
      - name: Pack Windows builds
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/超級碧琪" -DestinationPath "dist/super-pinkie-control-windows-portable.zip" -Force
          Copy-Item -LiteralPath "dist/超級碧琪.exe" -Destination "dist/super-pinkie-control-windows.exe" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 超級碧琪-windows-self-contained
          path: |
            dist/超級碧琪.exe
            dist/super-pinkie-control-windows.exe
            dist/super-pinkie-control-windows-portable.zip
