name: UI parity

# Builds and evidence only. Publishing remains a separate, approved action.
on:
  push:
    branches: ["fix/windows-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and capture inputs
        run: |
          version="$(python3 -c 'import json; print(json.load(open("desktop/windows/runtime-manifest.json"))["openclaw"])')"
          npm install -g "openclaw@$version"
          python3 -m pip install --disable-pip-version-check edge-tts aiohttp
          deps="$RUNNER_TEMP/pinkie-ui-deps"
          npm install --prefix "$deps" --no-save playwright ws
          "$deps/node_modules/.bin/playwright" install chromium webkit
          echo "PINKIE_UI_DEPS=$deps" >> "$GITHUB_ENV"
      - name: Build the actual Mac package
        run: ./desktop/macos/build.sh
      - name: Capture the packaged Mac UI in Chromium
        timeout-minutes: 8
        run: |
          control="dist/超級碧琪.app/Contents/Resources/SuperPinkie/runtime/openclaw/dist/control-ui"
          python3 tools/ui-parity/bundle.py check --control-ui "$control" --output parity/macos-ui-manifest.json
          node tools/ui-parity/capture.mjs --control-ui "$control" --browser chromium --label mac-chromium --out parity/shots --strict
      - name: Verify the packaged Mac UI in WebKit
        timeout-minutes: 8
        run: |
          control="dist/超級碧琪.app/Contents/Resources/SuperPinkie/runtime/openclaw/dist/control-ui"
          node tools/ui-parity/capture.mjs --control-ui "$control" --browser webkit --label mac-webkit --out parity/shots --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-parity-macos
          path: parity

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the actual Windows package
        shell: pwsh
        run: .\build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ui-parity-windows-app
          path: dist/超級碧琪
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ui-parity-windows-manifest
          path: dist/windows-ui-manifest.json

  windows-smoke:
    needs: windows
    uses: ./.github/workflows/windows-smoke.yml
    with:
      app_artifact: ui-parity-windows-app

  compare:
    needs: [macos, windows, windows-smoke]
    # Collect the native Windows review even if Mac's WebKit automation fails.
    # That failure remains red; actual manifest differences also still fail.
    if: ${{ always() && needs.windows.result == 'success' && needs.windows-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-parity-macos
          path: parity/mac
      - uses: actions/download-artifact@v4
        with:
          name: ui-parity-windows-manifest
          path: parity/windows
      - uses: actions/download-artifact@v4
        with:
          name: windows-smoke-${{ github.run_id }}
          path: parity/windows-evidence
      - name: Require identical packaged UI
        run: python3 tools/ui-parity/bundle.py compare parity/mac/macos-ui-manifest.json parity/windows/windows-ui-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-parity-review
          path: parity
