name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: |
          chmod +x desktop/macos/build.sh
          desktop/macos/build.sh
      - name: Pack full installer source
        run: |
          git archive --format=zip --output="dist/super-pinkie-full-${GITHUB_REF_NAME#v}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/super-pinkie-macos-*.zip
            dist/super-pinkie-full-*.zip
