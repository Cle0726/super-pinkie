name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a versioned release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release must run from the tag matching VERSION: v$version" >&2
            exit 1
          fi

  verify:
    needs: tag
    uses: ./.github/workflows/verify.yml

  source:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack full installer source
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/super-pinkie-full-${GITHUB_REF_NAME#v}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          body_path: desktop/windows/release-notes.md
          fail_on_unmatched_files: true
          files: dist/super-pinkie-full-*.zip

  macos:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bundled runtime inputs
        run: |
          version="$(python3 -c 'import json; print(json.load(open("desktop/windows/runtime-manifest.json"))["openclaw"])')"
          npm install -g "openclaw@$version"
          python3 -m pip install --disable-pip-version-check edge-tts aiohttp
      - name: Build self-contained macOS app
        run: ./desktop/macos/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          body_path: desktop/windows/release-notes.md
          fail_on_unmatched_files: true
          files: dist/super-pinkie-macos-*.zip

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('.\installer\windows\apply-theme.ps1', '.\install.ps1', '.\services\watchdog\windows-gateway-watchdog.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax check failed' }
      - name: Build Windows exe
        shell: pwsh
        run: .\build-win.ps1 -LegacyOneFile
      - name: Pack Windows onedir and compatibility exe
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $file = "super-pinkie-windows-$version.exe"
          Copy-Item -LiteralPath 'dist\超級碧琪.exe' -Destination "dist\$file" -Force
          $hash = (Get-FileHash -LiteralPath "dist\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -LiteralPath "dist\$file.sha256" -Encoding ascii -NoNewline

          # The portable onedir package is the recommended download: it keeps
          # the bundled runtime beside the launcher and starts without _MEI
          # extraction.  Include the directory name in the archive root.
          $portable = "super-pinkie-windows-$version-portable.zip"
          Compress-Archive -Path 'dist\超級碧琪' -DestinationPath "dist\$portable" -Force
          $portableHash = (Get-FileHash -LiteralPath "dist\$portable" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $portable" | Set-Content -LiteralPath "dist\$portable.sha256" -Encoding ascii -NoNewline
      - name: Keep the onedir for the smoke test
        uses: actions/upload-artifact@v4
        with:
          name: windows-onedir
          path: dist/超級碧琪
          retention-days: 3
      - name: Keep the release files until the smoke test passes
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          retention-days: 3
          path: |
            dist/super-pinkie-windows-*.exe
            dist/super-pinkie-windows-*.exe.sha256
            dist/super-pinkie-windows-*-portable.zip
            dist/super-pinkie-windows-*-portable.zip.sha256

  # The packaged App is opened on a real Windows runner (fresh and upgraded
  # profile, all five modes) before anything is uploaded to the release.
  windows-smoke:
    needs: windows
    uses: ./.github/workflows/windows-smoke.yml
    with:
      app_artifact: windows-onedir

  windows-publish:
    needs: windows-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: desktop/windows/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/super-pinkie-windows-*.exe
            dist/super-pinkie-windows-*.exe.sha256
            dist/super-pinkie-windows-*-portable.zip
            dist/super-pinkie-windows-*-portable.zip.sha256
