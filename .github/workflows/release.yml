name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a versioned release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release must run from the tag matching VERSION: v$version" >&2
            exit 1
          fi
      - name: Run all execution, recovery, UI and desktop regression tests
        run: |
          node --test tests/*.test.cjs tests/*.test.mjs
          python -m unittest discover -s tests -p '*_test.py' -v
      - name: Check bundled scripts
        run: |
          find ui/injections -name '*.js' -print0 | xargs -0 -n1 node --check
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          python -m py_compile services/process_io.py services/party/server.py services/roundtable/server.py services/tts/edge_tts_server.py proxy/ur-rewrite-proxy.py app/super_pinkie.py app/windows_desktop.py

  source:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack full installer source
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/super-pinkie-full-${GITHUB_REF_NAME#v}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/super-pinkie-full-*.zip

  macos:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bundled runtime inputs
        run: |
          version="$(python3 -c 'import json; print(json.load(open("desktop/windows/cle-runtime-manifest.json"))["openclaw"])')"
          npm install -g "openclaw@$version"
          python3 -m pip install --disable-pip-version-check edge-tts aiohttp
          npm ci --prefix services/cle-studio --no-audit --no-fund
      - name: Build self-contained macOS app
        run: CLE_BRAND=1 ./desktop/macos/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/cle-studio-macos-*.zip

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('.\installer\windows\apply-theme.ps1', '.\install.ps1', '.\services\watchdog\windows-gateway-watchdog.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
          }
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax check failed' }
      - name: Build Windows exe
        shell: pwsh
        run: .\build-win.ps1 -CleBrand -LegacyOneFile
      - name: Pack Windows onedir and compatibility exe
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $file = "cle-studio-windows-$version.exe"
          Copy-Item -LiteralPath 'dist\C.le.exe' -Destination "dist\$file" -Force
          $hash = (Get-FileHash -LiteralPath "dist\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -LiteralPath "dist\$file.sha256" -Encoding ascii -NoNewline

          # The portable onedir package is the recommended download: it keeps
          # the bundled runtime beside the launcher and starts without _MEI
          # extraction.  Include the directory name in the archive root.
          $portable = "cle-studio-windows-$version-portable.zip"
          Compress-Archive -Path 'dist\C.le' -DestinationPath "dist\$portable" -Force
          $portableHash = (Get-FileHash -LiteralPath "dist\$portable" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $portable" | Set-Content -LiteralPath "dist\$portable.sha256" -Encoding ascii -NoNewline
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/cle-studio-windows-*.exe
            dist/cle-studio-windows-*.exe.sha256
            dist/cle-studio-windows-*-portable.zip
            dist/cle-studio-windows-*-portable.zip.sha256
