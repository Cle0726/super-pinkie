name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack full installer source
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/super-pinkie-full-${GITHUB_REF_NAME#v}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/super-pinkie-full-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\installer\windows\apply-theme.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax check failed' }
      - name: Build Windows exe
        shell: pwsh
        run: .\build-win.ps1
      - name: Pack Windows exe
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          Copy-Item -LiteralPath 'dist\超級碧琪.exe' -Destination "dist\super-pinkie-windows-$version.exe" -Force
          Compress-Archive -LiteralPath 'dist\超級碧琪.exe' -DestinationPath "dist\super-pinkie-windows-$version.zip" -Force
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/super-pinkie-windows-*.exe
            dist/super-pinkie-windows-*.zip
