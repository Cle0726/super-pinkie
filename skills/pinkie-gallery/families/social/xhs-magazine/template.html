<style>
  .c { padding: 70px 76px 76px; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 22px; border-bottom: 2px solid var(--ink); }
  .mast { font-family: var(--font-accent); font-weight: 900; font-size: 92px; line-height: .9; letter-spacing: .02em; }
  .issue { font: 600 30px/1 var(--font-body); letter-spacing: .12em; color: var(--muted); }
  .rule2 { height: 6px; margin-top: 8px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .body { flex: 1; display: grid; grid-template-columns: 1fr 250px; column-gap: 48px; padding-top: 70px; }
  .left { display: flex; flex-direction: column; }
  .title { font-family: var(--font-title); font-weight: var(--w-title); font-size: 150px; line-height: 1.14; letter-spacing: -0.01em; }
  .title .hl { color: var(--accent); font-style: italic; }
  .deck { margin-top: 56px; font: 400 44px/1.6 var(--font-body); color: var(--ink); opacity: .86; text-indent: 0; }
  .deck::first-letter { font-family: var(--font-title); font-weight: 800; font-size: 2.6em; float: left; line-height: .9; margin: 6px 14px 0 0; color: var(--accent); }
  .right { border-left: 2px solid var(--line); padding-left: 34px; display: flex; flex-direction: column; justify-content: flex-end; gap: 34px; }
  .line { font: 700 36px/1.35 var(--font-body); }
  .line i { display: block; font: 800 italic 28px/1 var(--font-accent); color: var(--accent); margin-bottom: 10px; font-style: italic; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 56px; padding-top: 22px; border-top: 2px solid var(--ink); }
  .who { font: 600 32px/1 var(--font-body); letter-spacing: .06em; }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 44px; }
  .bars span { width: 6px; background: var(--ink); }
</style>
<div class="canvas c">
  <div class="bar">
    <div class="mast" data-if="masthead" data-slot="masthead" data-fit="56" data-maxlines="1"></div>
    <div class="issue" data-if="issue" data-slot="issue"></div>
  </div>
  <div class="rule2"></div>
  <div class="body">
    <div class="left">
      <h1 class="title" data-slot="title" data-fit="96" data-maxlines="3"></h1>
      <p class="deck" data-if="deck" data-slot="deck" data-fit="34" data-maxlines="4"></p>
    </div>
    <div class="right" data-if="lines">
      <template data-each="lines" data-max="3"><div class="line"><i data-index="2"></i><span data-field="text" data-fit="28" data-maxlines="3"></span></div></template>
    </div>
  </div>
  <div class="foot">
    <div class="who" data-if="author" data-slot="author"></div>
    <div class="bars" data-decor><span style="height:44px"></span><span style="height:30px"></span><span style="height:40px;width:3px"></span><span style="height:22px"></span><span style="height:44px;width:10px"></span><span style="height:34px;width:3px"></span><span style="height:44px"></span><span style="height:26px;width:4px"></span><span style="height:40px"></span></div>
  </div>
</div>
