<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>09 数据驱动型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #999999;
    --accent: #0B62DB;
    --accent-bg: rgba(37,99,235,0.08);
    --card-bg: #F8F8F8;
    --divider: #F0F0F0;
    --number-color: #1A1A1A;
    --brand-color: rgba(0,0,0,0.3);
    --up-color: #22C55E;
    --up-bg: rgba(34,197,94,0.08);
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --text-primary: #F0F0F0;
    --text-muted: #555555;
    --accent: #60A5FA;
    --accent-bg: rgba(96,165,250,0.1);
    --card-bg: #1A1A1A;
    --divider: #2A2A2A;
    --number-color: #F0F0F0;
    --brand-color: rgba(255,255,255,0.25);
    --up-color: #4ADE80;
    --up-bg: rgba(74,222,128,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    justify-content:center;
    padding:24px 24px;
  }
  .brand { font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:16px; opacity:0.55; }
  /* 核心大数字 */
  .big-number { font-size:72px; font-weight:900; color:var(--number-color); line-height:1.0; letter-spacing:-1px; }
  .big-unit { font-size:24px; font-weight:800; color:var(--accent); display:inline; }
  .big-title { font-size:32px; font-weight:900; color:var(--text-primary); line-height:1.2; margin-top:4px; margin-bottom:6px; letter-spacing:-0.5px; }
  .big-sub { font-size:13px; color:var(--text-muted); margin-bottom:20px; line-height:1.5; }
  /* 指标网格 */
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .metric {
    background:var(--card-bg); border-radius:10px; padding:12px;
  }
  .metric-label { font-size:12px; color:var(--text-muted); margin-bottom:4px; }
  .metric-value { font-size:20px; font-weight:900; color:var(--text-primary); line-height:1.1; }
  .metric-change { display:inline-flex; align-items:center; gap:2px; font-size:11px; font-weight:700; color:var(--up-color); background:var(--up-bg); padding:1px 6px; border-radius:4px; margin-top:4px; }
  .footer { margin-top:18px; font-size:12px; color:var(--text-muted); text-align:center; }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="brand" contenteditable="true">TATALAB · MONTHLY</div>
  <div class="big-number">8.6<span class="big-unit">万</span></div>
  <div class="big-title" contenteditable="true">4月阅读量<br>月环比涨42%</div>
  <div class="big-sub" contenteditable="true">AI自媒体实录 · 真实数据不注水</div>
  <div class="metrics">
    <div class="metric">
      <div class="metric-label" contenteditable="true">粉丝总量</div>
      <div class="metric-value" contenteditable="true">14,280</div>
      <div class="metric-change">↑ +2,340</div>
    </div>
    <div class="metric">
      <div class="metric-label" contenteditable="true">互动率</div>
      <div class="metric-value" contenteditable="true">6.8%</div>
      <div class="metric-change">↑ 行业2倍</div>
    </div>
    <div class="metric">
      <div class="metric-label" contenteditable="true">爆款文章</div>
      <div class="metric-value" contenteditable="true">3 篇</div>
      <div class="metric-change">↑ 历史最佳</div>
    </div>
    <div class="metric">
      <div class="metric-label" contenteditable="true">均创作时间</div>
      <div class="metric-value" contenteditable="true">12 分钟</div>
      <div class="metric-change">↓ Cola提效</div>
    </div>
  </div>
  <div class="footer">数据说话，成长看得见 →</div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
