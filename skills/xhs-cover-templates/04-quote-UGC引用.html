<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>04 UGC评论截图型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #F5F5F5;
    --card-bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #999999;
    --text-sub: #666666;
    --border: #F0F0F0;
    --avatar-bg: linear-gradient(135deg,#FF9A9E,#FECFEF);
    --like-color: #FF2442;
    --reply-bg: #F8F8F8;
    --brand-color: rgba(0,0,0,0.3);
  }
  [data-theme="dark"] {
    --bg: #111111;
    --card-bg: #1A1A1A;
    --text-primary: #F0F0F0;
    --text-muted: #555555;
    --text-sub: #888888;
    --border: #2A2A2A;
    --avatar-bg: linear-gradient(135deg,#8B3A2A,#7A3020);
    --like-color: #FF2442;
    --reply-bg: #222222;
    --brand-color: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    justify-content:center;
    padding:24px 22px;
  }
  .brand { font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:14px; opacity:0.55; }
  .title { font-size:14px; font-weight:700; color:var(--text-sub); margin-bottom:12px; }
  /* 评论卡片 */
  .comment-card {
    background:var(--card-bg); border-radius:12px; padding:16px;
    margin-bottom:8px;
  }
  .comment-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--avatar-bg); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#FFF; flex-shrink:0; }
  .user-info { flex:1; }
  .username { font-size:13px; font-weight:700; color:var(--text-primary); }
  .user-time { font-size:11px; color:var(--text-muted); margin-top:1px; }
  .like-btn { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .like-icon { font-size:14px; color:var(--like-color); }
  .like-count { font-size:10px; color:var(--text-muted); }
  .comment-text { font-size:18px; color:var(--text-primary); line-height:1.6; }
  /* 回复 */
  .reply-card {
    background:var(--reply-bg); border-radius:10px; padding:12px 14px;
    margin-top:10px;
  }
  .reply-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .reply-avatar { width:22px; height:22px; border-radius:50%; background:var(--avatar-bg); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#FFF; flex-shrink:0; }
  .reply-name { font-size:12px; font-weight:700; color:var(--text-primary); }
  .reply-badge { font-size:10px; background:var(--like-color); color:#FFF; padding:1px 5px; border-radius:4px; font-weight:600; }
  .reply-text { font-size:13px; color:var(--text-sub); line-height:1.5; }
  /* 第二条评论 */
  .comment-card.mini { padding:14px 16px; }
  .mini-row { display:flex; align-items:center; gap:8px; }
  .mini-avatar { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#A1C4FD,#C2E9FB); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#FFF; flex-shrink:0; }
  .mini-text { font-size:13px; color:var(--text-primary); line-height:1.5; flex:1; }
  .mini-like { font-size:10px; color:var(--text-muted); white-space:nowrap; }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="brand" contenteditable="true">TATALAB</div>
  <div class="title" contenteditable="true">💬 精选评论 · 真实用户反馈</div>
  <div class="comment-card">
    <div class="comment-header">
      <div class="avatar">云</div>
      <div class="user-info">
        <div class="username">云上的日子</div>
        <div class="user-time">3天前</div>
      </div>
      <div class="like-btn">
        <span class="like-icon">♥</span>
        <span class="like-count">2,341</span>
      </div>
    </div>
    <div class="comment-text">用Cola写了一篇公众号，从选题到发布只花了2小时，以前至少要一整天</div>
    <div class="reply-card">
      <div class="reply-header">
        <div class="reply-avatar">塔</div>
        <span class="reply-name">塔塔AI课代表</span>
        <span class="reply-badge">作者</span>
      </div>
      <div class="reply-text">哈哈关键是内容质量也没掉，工具用对了就是效率杠杆 🔥</div>
    </div>
  </div>
  <div class="comment-card mini">
    <div class="mini-row">
      <div class="mini-avatar">李</div>
      <div class="mini-text">自从用了AI辅助写作，我终于敢日更了</div>
      <span class="mini-like">♥ 892</span>
    </div>
  </div>
  <div class="comment-card mini">
    <div class="mini-row">
      <div class="mini-avatar">K</div>
      <div class="mini-text">请问这个工具在哪下载？求链接！</div>
      <span class="mini-like">♥ 567</span>
    </div>
  </div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
