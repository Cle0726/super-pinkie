<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>12 素人感备忘录型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #111111;
    --text-muted: #888888;
    --text-light: #BBBBBB;
    --border: #E8E8E8;
    --brand-color: rgba(0,0,0,0.25);
    --check-color: #1A1A1A;
    --uncheck-color: #DDDDDD;
  }
  [data-theme="dark"] {
    --bg: #111111;
    --text-primary: #F0F0F0;
    --text-muted: #666666;
    --text-light: #444444;
    --border: #2A2A2A;
    --brand-color: rgba(255,255,255,0.2);
    --check-color: #60A5FA;
    --uncheck-color: #333333;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    padding:24px 24px 20px;
  }
  /* 模拟备忘录顶栏 */
  .memo-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .memo-back { font-size:14px; color:var(--text-light); }
  .memo-done { font-size:13px; color:var(--text-light); }
  .memo-title { font-size:32px; font-weight:900; color:var(--text-primary); line-height:1.15; margin-bottom:4px; letter-spacing:-0.5px; }
  .memo-date { font-size:10px; color:var(--text-light); margin-bottom:14px; letter-spacing:0.04em; opacity:0.6; }
  /* 正文区——模拟手写备忘录 */
  .memo-body { flex:1; display:flex; flex-direction:column; gap:0; }
  .memo-line {
    font-size:14px; color:var(--text-primary); line-height:1.6;
    padding:3px 0; border-bottom:1px solid var(--border);
  }
  .memo-line.heading { font-size:15px; font-weight:700; color:var(--text-primary); margin-top:8px; }
  .memo-line .muted { color:var(--text-muted); }
  /* 清单项 */
  .check-item {
    display:flex; align-items:flex-start; gap:8px;
    padding:5px 0; border-bottom:1px solid var(--border);
  }
  .check-box { width:16px; height:16px; border-radius:4px; flex-shrink:0; margin-top:3px; display:flex; align-items:center; justify-content:center; }
  .check-box.checked { background:var(--check-color); }
  .check-box.checked::after { content:"✓"; color:#FFF; font-size:10px; font-weight:700; }
  .check-box.unchecked { border:1.5px solid var(--uncheck-color); }
  .check-text { font-size:15px; color:var(--text-primary); line-height:1.5; }
  .check-text.done { text-decoration:line-through; color:var(--text-muted); }
  .memo-footer { margin-top:auto; padding-top:10px; display:flex; justify-content:space-between; }
  .memo-footer span { font-size:10px; color:var(--text-light); }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="memo-header">
    <span class="memo-back">‹ 备忘录</span>
    <span class="memo-done">完成</span>
  </div>
  <div class="memo-title" contenteditable="true">一份找到天赋的<br>邪修测试</div>
  <div class="memo-date">2026年4月14日 · TATALAB</div>
  <div class="memo-body">
    <div class="memo-line heading" contenteditable="true">📋 测试题</div>
    <div class="memo-line" contenteditable="true">1. 如果人生只剩1年，你最想做什么？</div>
    <div class="memo-line" contenteditable="true"><span class="muted">A. 写一本书　B. 环游世界　C. 创业</span></div>
    <div class="memo-line" contenteditable="true">2. 朋友最常夸你什么？</div>
    <div class="memo-line" contenteditable="true"><span class="muted">A. 有创意　B. 靠谱　C. 会表达</span></div>
    <div class="memo-line" contenteditable="true">3. 你愿意免费做的事？</div>
    <div class="memo-line" contenteditable="true"><span class="muted">A. 教别人用工具　B. 写文章　C. 做视频</span></div>
    <div class="memo-line heading" contenteditable="true">✅ 我的结果</div>
    <div class="check-item">
      <div class="check-box checked"></div>
      <span class="check-text done">完成了3道题</span>
    </div>
    <div class="check-item">
      <div class="check-box unchecked"></div>
      <span class="check-text">看看答案分析 →</span>
    </div>
  </div>
  <div class="memo-footer">
    <span>截图自备忘录</span>
    <span>@塔塔AI课代表</span>
  </div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
