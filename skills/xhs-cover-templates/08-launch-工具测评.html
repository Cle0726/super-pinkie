<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>08 测评型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #888888;
    --text-sub: #666666;
    --card-bg: #F8F8F8;
    --star-color: #F59E0B;
    --accent: #0B62DB;
    --tag-bg: #F0F0F0;
    --tag-text: #555555;
    --hot-bg: #FF6B9D;
    --hot-text: #FFFFFF;
    --divider: #F0F0F0;
    --brand-color: rgba(0,0,0,0.3);
    --logo-bg: #F0F0F0;
    --logo-inner: linear-gradient(135deg,#1A1A1A,#4A4340);
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --text-primary: #F0F0F0;
    --text-muted: #666666;
    --text-sub: #888888;
    --card-bg: #1A1A1A;
    --star-color: #FBBF24;
    --accent: #60A5FA;
    --tag-bg: #2A2A2A;
    --tag-text: #AAAAAA;
    --hot-bg: #FF6B9D;
    --hot-text: #FFFFFF;
    --divider: #2A2A2A;
    --brand-color: rgba(255,255,255,0.25);
    --logo-bg: #1E1E1E;
    --logo-inner: linear-gradient(135deg,#0B62DB,#1E40AF);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:22px 24px;
    position:relative;
  }
  .brand { position:absolute; top:22px; left:24px; font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; opacity:0.55; }
  .review-badge { position:absolute; top:22px; right:24px; font-size:10px; color:var(--text-muted); opacity:0.6; }
  .logo-box {
    width:80px; height:80px; border-radius:20px;
    background:var(--logo-bg); display:flex; align-items:center; justify-content:center;
    margin-bottom:16px;
  }
  .logo-inner {
    width:56px; height:56px; border-radius:14px;
    background:var(--logo-inner);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-text { font-size:24px; font-weight:900; color:#FFFFFF; font-style:italic; }
  .name { font-size:36px; font-weight:900; color:var(--text-primary); letter-spacing:-0.5px; margin-bottom:3px; }
  .version { font-size:14px; color:var(--text-muted); margin-bottom:12px; line-height:1.5; }
  .stars { font-size:20px; color:var(--star-color); letter-spacing:3px; margin-bottom:14px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:16px; }
  .tag { font-size:12px; font-weight:600; padding:4px 10px; border-radius:14px; background:var(--tag-bg); color:var(--tag-text); }
  .tag.hot { background:var(--hot-bg); color:var(--hot-text); }
  /* 评分行 */
  .ratings { width:100%; display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--divider); padding-top:14px; }
  .rate-row { display:flex; align-items:center; justify-content:space-between; }
  .rate-label { font-size:13px; color:var(--text-sub); }
  .rate-bar-wrap { width:120px; height:6px; background:var(--tag-bg); border-radius:3px; overflow:hidden; }
  .rate-bar { height:100%; border-radius:3px; background:var(--accent); }
  .rate-score { font-size:13px; font-weight:800; color:var(--text-primary); width:28px; text-align:right; }
  .verdict { margin-top:14px; font-size:13px; color:var(--text-muted); text-align:center; line-height:1.5; }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="brand" contenteditable="true">TATALAB©</div>
  <div class="review-badge">TOOL REVIEW</div>
  <div class="logo-box">
    <div class="logo-inner">
      <div class="logo-text">H</div>
    </div>
  </div>
  <div class="name">Hermes 3.0</div>
  <div class="version">被低估的阅读神器</div>
  <div class="stars">★★★★★</div>
  <div class="tags">
    <div class="tag">免费</div>
    <div class="tag hot">强烈推荐</div>
    <div class="tag">速度极快</div>
  </div>
  <div class="ratings">
    <div class="rate-row">
      <span class="rate-label">速度</span>
      <div class="rate-bar-wrap"><div class="rate-bar" style="width:95%"></div></div>
      <span class="rate-score">9.5</span>
    </div>
    <div class="rate-row">
      <span class="rate-label">准确性</span>
      <div class="rate-bar-wrap"><div class="rate-bar" style="width:88%"></div></div>
      <span class="rate-score">8.8</span>
    </div>
    <div class="rate-row">
      <span class="rate-label">易用性</span>
      <div class="rate-bar-wrap"><div class="rate-bar" style="width:92%"></div></div>
      <span class="rate-score">9.2</span>
    </div>
  </div>
  <div class="verdict">阅读效率提升5倍，但你可能从没听说过它</div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
