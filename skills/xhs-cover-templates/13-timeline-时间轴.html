<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>13 时间线型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #888888;
    --text-light: #BBBBBB;
    --line-color: #E8E8E8;
    --node1: #1A1A1A; --node2: #0B62DB; --node3: #FF6B9D; --node4: #F59E0B; --node5: #22C55E;
    --accent: #0B62DB;
    --tag-bg: #F0F0F0; --tag-text: #555555;
    --tag-hl-bg: rgba(37,99,235,0.08); --tag-hl-text: #0B62DB;
    --brand-color: rgba(0,0,0,0.3);
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --text-primary: #F0F0F0;
    --text-muted: #666666;
    --text-light: #444444;
    --line-color: #2A2A2A;
    --node1: #F0F0F0; --node2: #60A5FA; --node3: #FF6B9D; --node4: #FBBF24; --node5: #4ADE80;
    --accent: #60A5FA;
    --tag-bg: #2A2A2A; --tag-text: #888888;
    --tag-hl-bg: rgba(96,165,250,0.15); --tag-hl-text: #60A5FA;
    --brand-color: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    padding:20px 22px 14px;
  }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .brand { font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; opacity:0.55; }
  .title { font-size:32px; font-weight:900; color:var(--text-primary); line-height:1.12; letter-spacing:-0.5px; margin-bottom:3px; }
  .title .accent { color:var(--accent); }
  .subtitle { font-size:12px; color:var(--text-muted); margin-bottom:10px; line-height:1.5; }
  /* 时间线 */
  .timeline { flex:1; position:relative; padding-left:32px; display:flex; flex-direction:column; gap:0; overflow:hidden; }
  .timeline::before {
    content:""; position:absolute; left:8px; top:8px; bottom:8px;
    width:1.5px; background:var(--line-color);
  }
  .tl-item { display:flex; align-items:flex-start; position:relative; flex:1; }
  .node {
    position:absolute; left:-24px; top:3px;
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
  }
  .node.n1 { background:var(--node1); }
  .node.n2 { background:var(--node2); }
  .node.n3 { background:var(--node3); }
  .node.n4 { background:var(--node4); }
  .node.n5 { background:var(--node5); }
  .tl-content { flex:1; }
  .tl-day { font-size:9px; font-weight:700; color:var(--text-light); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0; }
  .tl-title { font-size:13px; font-weight:800; color:var(--text-primary); line-height:1.2; margin-bottom:0; }
  .tl-desc { font-size:11px; color:var(--text-muted); line-height:1.3; margin-bottom:2px; }
  .tl-tag { display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px; }
  .tl-tag.normal { background:var(--tag-bg); color:var(--tag-text); }
  .tl-tag.highlight { background:var(--tag-hl-bg); color:var(--tag-hl-text); }
  .footer { margin-top:6px; font-size:11px; color:var(--text-muted); text-align:center; }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <div class="brand" contenteditable="true">TATALAB</div>
  </div>
  <div class="title" contenteditable="true"><span class="accent">30</span>天<br>从0到10000粉</div>
  <div class="subtitle" contenteditable="true">小红书起号全程实录</div>
  <div class="timeline">
    <div class="tl-item">
      <div class="node n1"></div>
      <div class="tl-content">
        <div class="tl-day">Day 1</div>
        <div class="tl-title" contenteditable="true">注册账号，0粉丝</div>
        <div class="tl-desc" contenteditable="true">想了3个月，终于决定开始</div>
        <span class="tl-tag normal">起点</span>
      </div>
    </div>
    <div class="tl-item">
      <div class="node n2"></div>
      <div class="tl-content">
        <div class="tl-day">Day 7</div>
        <div class="tl-title" contenteditable="true">第一篇爆文出现</div>
        <div class="tl-desc" contenteditable="true">选题「AI工具推荐」，单篇+1200粉</div>
        <span class="tl-tag highlight">🔥 爆款</span>
      </div>
    </div>
    <div class="tl-item">
      <div class="node n3"></div>
      <div class="tl-content">
        <div class="tl-day">Day 14</div>
        <div class="tl-title" contenteditable="true">粉丝破3000</div>
        <div class="tl-desc" contenteditable="true">找到属于自己的内容节奏</div>
        <span class="tl-tag normal">里程碑</span>
      </div>
    </div>
    <div class="tl-item">
      <div class="node n4"></div>
      <div class="tl-content">
        <div class="tl-day">Day 21</div>
        <div class="tl-title" contenteditable="true">Cola提效后效率跃升</div>
        <div class="tl-desc" contenteditable="true">创作时间从4小时→45分钟</div>
        <span class="tl-tag normal">效率</span>
      </div>
    </div>
    <div class="tl-item">
      <div class="node n5"></div>
      <div class="tl-content">
        <div class="tl-day">Day 30</div>
        <div class="tl-title" contenteditable="true">破万粉！</div>
        <div class="tl-desc" contenteditable="true">30天走完别人3个月的路</div>
        <span class="tl-tag highlight">🎯 达成</span>
      </div>
    </div>
  </div>
  <div class="footer">你的经历比你想象的更有价值</div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
