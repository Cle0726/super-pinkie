<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>16 工具合集型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #888888;
    --text-sub: #AAAAAA;
    --accent: #0B62DB;
    --card-bg: #F8F8F8;
    --card-border: #F0F0F0;
    --icon-bg-1: rgba(37,99,235,0.08);
    --icon-bg-2: rgba(255,107,157,0.08);
    --icon-bg-3: rgba(34,197,94,0.08);
    --icon-bg-4: rgba(245,158,11,0.08);
    --icon-bg-5: rgba(139,92,246,0.08);
    --icon-bg-6: rgba(14,165,233,0.08);
    --brand-color: rgba(0,0,0,0.3);
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --text-primary: #F0F0F0;
    --text-muted: #666666;
    --text-sub: #444444;
    --accent: #60A5FA;
    --card-bg: #1A1A1A;
    --card-border: #2A2A2A;
    --icon-bg-1: rgba(96,165,250,0.12);
    --icon-bg-2: rgba(255,107,157,0.12);
    --icon-bg-3: rgba(74,222,128,0.12);
    --icon-bg-4: rgba(251,191,36,0.12);
    --icon-bg-5: rgba(167,139,250,0.12);
    --icon-bg-6: rgba(56,189,248,0.12);
    --brand-color: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    justify-content:center;
    padding:22px 22px 18px;
  }
  .brand { font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:14px; opacity:0.55; }
  .title { font-size:32px; font-weight:900; color:var(--text-primary); line-height:1.12; letter-spacing:-0.5px; margin-bottom:4px; }
  .title .accent { color:var(--accent); }
  .subtitle { font-size:13px; color:var(--text-muted); margin-bottom:18px; }
  /* 工具网格 */
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:16px; }
  .tool-cell {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:14px 6px 10px;
    background:var(--card-bg); border-radius:12px;
  }
  .tool-icon {
    width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .tool-icon.i1 { background:var(--icon-bg-1); }
  .tool-icon.i2 { background:var(--icon-bg-2); }
  .tool-icon.i3 { background:var(--icon-bg-3); }
  .tool-icon.i4 { background:var(--icon-bg-4); }
  .tool-icon.i5 { background:var(--icon-bg-5); }
  .tool-icon.i6 { background:var(--icon-bg-6); }
  .tool-name { font-size:12px; font-weight:700; color:var(--text-primary); text-align:center; line-height:1.2; }
  .tool-desc { font-size:10px; color:var(--text-muted); text-align:center; line-height:1.3; }
  .footer { font-size:12px; color:var(--text-sub); text-align:center; }
  .footer strong { color:var(--accent); font-weight:700; }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="brand" contenteditable="true">TATALAB · WEEKLY FINDS</div>
  <div class="title" contenteditable="true">这周发现了<span class="accent">6个</span>神器</div>
  <div class="subtitle" contenteditable="true">每一个都值得收藏</div>
  <div class="grid">
    <div class="tool-cell">
      <div class="tool-icon i1">🤖</div>
      <div class="tool-name">Cola</div>
      <div class="tool-desc">AI副驾驶</div>
    </div>
    <div class="tool-cell">
      <div class="tool-icon i2">💻</div>
      <div class="tool-name">Cursor</div>
      <div class="tool-desc">AI编程</div>
    </div>
    <div class="tool-cell">
      <div class="tool-icon i3">🎨</div>
      <div class="tool-name">即梦</div>
      <div class="tool-desc">AI出图</div>
    </div>
    <div class="tool-cell">
      <div class="tool-icon i4">🔍</div>
      <div class="tool-name">Perplexity</div>
      <div class="tool-desc">AI搜索</div>
    </div>
    <div class="tool-cell">
      <div class="tool-icon i5">📝</div>
      <div class="tool-name">Obsidian</div>
      <div class="tool-desc">知识库</div>
    </div>
    <div class="tool-cell">
      <div class="tool-icon i6">📊</div>
      <div class="tool-name">NotebookLM</div>
      <div class="tool-desc">AI阅读</div>
    </div>
  </div>
  <div class="footer">详细测评在正文 · <strong>@TATALAB</strong></div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
