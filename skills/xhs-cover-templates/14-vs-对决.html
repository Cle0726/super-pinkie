<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>14 VS对决型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #888888;
    --card-a-bg: #1A1A1A; --card-a-text: #FFFFFF; --card-a-muted: rgba(255,255,255,0.5);
    --card-b-bg: #F5F5F5; --card-b-text: #1A1A1A; --card-b-muted: #888888;
    --vs-bg: #0B62DB; --vs-text: #FFFFFF;
    --verdict-bg: #1A1A1A; --verdict-text: #FFFFFF; --verdict-accent: #0B62DB;
    --divider-a: rgba(255,255,255,0.08); --divider-b: #E8E8E8;
    --brand-color: rgba(0,0,0,0.3);
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --text-primary: #F0F0F0;
    --text-muted: #555555;
    --card-a-bg: #0D1B2E; --card-a-text: #F0F0F0; --card-a-muted: rgba(240,240,240,0.45);
    --card-b-bg: #1A1A1A; --card-b-text: #F0F0F0; --card-b-muted: #666666;
    --vs-bg: #60A5FA; --vs-text: #FFFFFF;
    --verdict-bg: #1E1E1E; --verdict-text: #F0F0F0; --verdict-accent: #60A5FA;
    --divider-a: rgba(255,255,255,0.06); --divider-b: #2A2A2A;
    --brand-color: rgba(255,255,255,0.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    padding:20px 18px 16px; gap:8px;
  }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .brand { font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; opacity:0.55; }
  .badge { font-size:10px; color:var(--text-muted); opacity:0.6; }
  .title { font-size:32px; font-weight:900; color:var(--text-primary); line-height:1.12; letter-spacing:-0.5px; }
  .title .vs { color:var(--vs-bg); }
  .subtitle { font-size:12px; color:var(--text-muted); }
  /* VS区域 */
  .vs-area { flex:1; position:relative; display:flex; gap:0; min-height:0; }
  .side { flex:1; border-radius:12px; padding:12px 10px; display:flex; flex-direction:column; }
  .side.a { background:var(--card-a-bg); margin-right:18px; border-radius:12px 2px 2px 12px; }
  .side.b { background:var(--card-b-bg); margin-left:18px; border-radius:2px 12px 12px 2px; }
  .side-logo { font-size:20px; font-weight:900; margin-bottom:4px; }
  .side.a .side-logo { color:var(--card-a-text); }
  .side.b .side-logo { color:var(--card-b-text); }
  .side-name { font-size:16px; font-weight:900; margin-bottom:2px; }
  .side.a .side-name { color:var(--card-a-text); }
  .side.b .side-name { color:var(--card-b-text); }
  .side-sub { font-size:11px; margin-bottom:8px; }
  .side.a .side-sub { color:var(--card-a-muted); }
  .side.b .side-sub { color:var(--card-b-muted); }
  .spec { flex:1; display:flex; flex-direction:column; }
  .spec-row { padding:5px 0; border-bottom:1px solid; }
  .side.a .spec-row { border-bottom-color:var(--divider-a); }
  .side.b .spec-row { border-bottom-color:var(--divider-b); }
  .spec-row:last-child { border-bottom:none; }
  .spec-label { font-size:11px; margin-bottom:1px; }
  .side.a .spec-label { color:var(--card-a-muted); }
  .side.b .spec-label { color:var(--card-b-muted); }
  .spec-value { font-size:12px; font-weight:700; }
  .side.a .spec-value { color:var(--card-a-text); }
  .side.b .spec-value { color:var(--card-b-text); }
  .side-verdict { margin-top:auto; font-size:11px; font-weight:700; text-align:center; padding:4px 0; border-radius:6px; }
  .side.a .side-verdict { background:rgba(255,255,255,0.08); color:var(--card-a-text); }
  .side.b .side-verdict { background:var(--divider-b); color:var(--card-b-text); }
  /* VS badge */
  .vs-badge {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:32px; height:32px; border-radius:50%;
    background:var(--vs-bg); color:var(--vs-text);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:900; z-index:10;
    box-shadow:0 0 0 3px var(--bg);
  }
  .footer { background:var(--verdict-bg); border-radius:8px; padding:8px 12px; text-align:center; }
  .footer-text { font-size:12px; font-weight:700; color:var(--verdict-text); }
  .footer-text .accent { color:var(--verdict-accent); }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <div class="brand" contenteditable="true">TATALAB</div>
    <div class="badge">AI TOOL BATTLE</div>
  </div>
  <div class="title" contenteditable="true">ChatGPT <span class="vs">vs</span> Claude</div>
  <div class="subtitle" contenteditable="true">谁才是最强AI助手？实际使用角度的真实答案</div>
  <div class="vs-area">
    <div class="side a">
      <div class="side-logo">G</div>
      <div class="side-name">ChatGPT</div>
      <div class="side-sub" contenteditable="true">OpenAI · GPT-4o</div>
      <div class="spec">
        <div class="spec-row"><div class="spec-label">场景</div><div class="spec-value">通用问答/代码</div></div>
        <div class="spec-row"><div class="spec-label">上下文</div><div class="spec-value">128K tokens</div></div>
        <div class="spec-row"><div class="spec-label">中文写作</div><div class="spec-value">★★★★☆</div></div>
        <div class="spec-row"><div class="spec-label">价格</div><div class="spec-value">$20/月</div></div>
      </div>
      <div class="side-verdict">生态最完整</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="side b">
      <div class="side-logo">C</div>
      <div class="side-name">Claude</div>
      <div class="side-sub" contenteditable="true">Anthropic · 3.7</div>
      <div class="spec">
        <div class="spec-row"><div class="spec-label">场景</div><div class="spec-value">长文写作/分析</div></div>
        <div class="spec-row"><div class="spec-label">上下文</div><div class="spec-value">200K tokens</div></div>
        <div class="spec-row"><div class="spec-label">中文写作</div><div class="spec-value">★★★★★</div></div>
        <div class="spec-row"><div class="spec-label">价格</div><div class="spec-value">$20/月</div></div>
      </div>
      <div class="side-verdict">中文天花板</div>
    </div>
  </div>
  <div class="footer">
    <div class="footer-text">两个都用才是正确答案 — <span class="accent">TATALAB的选择</span></div>
  </div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
