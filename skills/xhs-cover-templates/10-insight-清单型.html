<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>10 排行榜型</title>
<style>
  html { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E5E5E5; }
  :root, [data-theme="light"] {
    --bg: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-muted: #888888;
    --text-sub: #999999;
    --accent: #0B62DB;
    --card-bg: #F8F8F8;
    --divider: #F0F0F0;
    --num-1: #F59E0B;
    --num-2: #888888;
    --num-3: #CD7F32;
    --num-rest: #CCCCCC;
    --tag-free: #E8F5E9; --tag-free-t: #2E7D32;
    --tag-hot: #FCE4EC; --tag-hot-t: #C2185B;
    --tag-new: #EEE9FF; --tag-new-t: #6B5CE7;
    --brand-color: rgba(0,0,0,0.3);
    --highlight-bg: #0B62DB;
    --highlight-text: #FFFFFF;
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --text-primary: #F0F0F0;
    --text-muted: #666666;
    --text-sub: #555555;
    --accent: #60A5FA;
    --card-bg: #1A1A1A;
    --divider: #2A2A2A;
    --num-1: #FBBF24;
    --num-2: #888888;
    --num-3: #CD7F32;
    --num-rest: #444444;
    --tag-free: #0D2010; --tag-free-t: #4CAF50;
    --tag-hot: #200010; --tag-hot-t: #FF6B9D;
    --tag-new: #120D28; --tag-new-t: #A48FFF;
    --brand-color: rgba(255,255,255,0.25);
    --highlight-bg: #0B62DB;
    --highlight-text: #FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:375px; height:500px; overflow:hidden;
    background:var(--bg);
    font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; flex-shrink:0;
  }
  .canvas {
    width:375px; height:500px; background:var(--bg);
    display:flex; flex-direction:column;
    padding:22px 22px 18px;
  }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .brand { font-size:10px; font-weight:700; color:var(--brand-color); letter-spacing:0.2em; text-transform:uppercase; opacity:0.55; }
  .year { font-size:10px; color:var(--text-sub); opacity:0.6; }
  .title { font-size:34px; font-weight:900; color:var(--text-primary); line-height:1.12; letter-spacing:-0.5px; margin-bottom:4px; }
  .title .hl { display:inline; background:var(--highlight-bg); color:var(--highlight-text); padding:1px 4px 2px; border-radius:3px; }
  .subtitle { font-size:13px; color:var(--text-muted); margin-bottom:14px; }
  /* 排行列表 */
  .list { flex:1; display:flex; flex-direction:column; gap:0; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--divider); }
  .item:last-child { border-bottom:none; }
  .rank { font-size:18px; font-weight:900; width:24px; text-align:center; flex-shrink:0; }
  .rank.r1 { color:var(--num-1); }
  .rank.r2 { color:var(--num-2); }
  .rank.r3 { color:var(--num-3); }
  .rank.r4, .rank.r5 { color:var(--num-rest); }
  .item-icon { font-size:20px; flex-shrink:0; }
  .item-body { flex:1; }
  .item-name { font-size:14px; font-weight:700; color:var(--text-primary); line-height:1.25; }
  .item-desc { font-size:12px; color:var(--text-muted); margin-top:1px; }
  .item-tag { font-size:10px; font-weight:700; padding:2px 6px; border-radius:14px; white-space:nowrap; flex-shrink:0; }
  .item-tag.hot { background:var(--tag-hot); color:var(--tag-hot-t); }
  .item-tag.free { background:var(--tag-free); color:var(--tag-free-t); }
  .item-tag.new { background:var(--tag-new); color:var(--tag-new-t); }
  .footer { margin-top:10px; font-size:11px; color:var(--text-sub); text-align:center; }

  /* Editor toolbar */
  body { height: auto !important; min-height: 100vh; }
  .toolbar {
    position:fixed; bottom:0; left:0; right:0;
    background:#fff; border-top:1px solid #e5e5e5;
    padding:10px 14px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap; z-index:999;
    font-family:"PingFang SC",sans-serif; font-size:11px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .tool-group { display:flex; align-items:center; gap:4px; }
  .tool-group label { color:#666; white-space:nowrap; font-size:11px; }
  .tool-group input[type="color"] { width:24px; height:24px; border:1px solid #ddd; border-radius:6px; cursor:pointer; padding:0; }
  .tool-group input[type="range"] { width:70px; accent-color:#0B62DB; }
  .toolbar button {
    background:#0B62DB; color:#fff; border:none;
    padding:7px 14px; border-radius:8px; font-size:12px;
    font-weight:600; cursor:pointer; margin-left:auto;
  }
  .toolbar button:hover { background:#0950b0; }
  [contenteditable]:hover { outline:1px dashed rgba(11,98,219,0.3); border-radius:3px; }
  [contenteditable]:focus { outline:2px solid rgba(11,98,219,0.5); border-radius:3px; background:rgba(11,98,219,0.03); }

</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <div class="brand" contenteditable="true">TATALAB</div>
    <div class="year">2026 · RANKING</div>
  </div>
  <div class="title" contenteditable="true">AI自媒体人<br>必装的<span class="hl">10个</span>工具</div>
  <div class="subtitle" contenteditable="true">亲测好用，每一个都在日常使用</div>
  <div class="list">
    <div class="item">
      <div class="rank r1">1</div>
      <div class="item-icon">🤖</div>
      <div class="item-body">
        <div class="item-name">Cola · AI副驾驶</div>
        <div class="item-desc" contenteditable="true">内容+日程+知识库，一站搞定</div>
      </div>
      <div class="item-tag hot">🔥 必装</div>
    </div>
    <div class="item">
      <div class="rank r2">2</div>
      <div class="item-icon">📝</div>
      <div class="item-body">
        <div class="item-name">Obsidian</div>
        <div class="item-desc" contenteditable="true">本地知识库，双向链接</div>
      </div>
      <div class="item-tag free">免费</div>
    </div>
    <div class="item">
      <div class="rank r3">3</div>
      <div class="item-icon">💻</div>
      <div class="item-body">
        <div class="item-name">Cursor</div>
        <div class="item-desc" contenteditable="true">AI编程，做产品利器</div>
      </div>
      <div class="item-tag new">新版本</div>
    </div>
    <div class="item">
      <div class="rank r4">4</div>
      <div class="item-icon">🎨</div>
      <div class="item-body">
        <div class="item-name">即梦 Dreamina</div>
        <div class="item-desc" contenteditable="true">AI出图，封面配图秒生成</div>
      </div>
      <div class="item-tag free">免费</div>
    </div>
    <div class="item">
      <div class="rank r5">5</div>
      <div class="item-icon">🔍</div>
      <div class="item-body">
        <div class="item-name">Perplexity</div>
        <div class="item-desc" contenteditable="true">AI搜索，选题调研第一站</div>
      </div>
      <div class="item-tag free">免费版够用</div>
    </div>
  </div>
  <div class="footer">完整10个 → 文章里都有</div>
</div>
<script>
  window.addEventListener('message', e => {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <label>背景</label>
    <input type="color" id="ctl-bg" value="#FFFFFF" oninput="document.querySelector('.canvas').style.background=this.value">
  </div>
  <div class="tool-group">
    <label>文字</label>
    <input type="color" id="ctl-text" value="#1A1A1A" oninput="document.querySelectorAll('.canvas [contenteditable]').forEach(e=>e.style.color=this.value)">
  </div>
  <div class="tool-group">
    <label>强调</label>
    <input type="color" id="ctl-accent" value="#0B62DB" oninput="document.querySelectorAll('.hl,.highlight-bg,.accent,.tag-hl,.badge').forEach(e=>e.style.background=this.value)">
  </div>
  <div class="tool-group">
    <label>标题 <span id="sz-val">36</span></label>
    <input type="range" id="ctl-size" min="20" max="64" value="36" oninput="document.getElementById('sz-val').textContent=this.value;document.querySelectorAll('.line,.main-title,.main-title-cn,.main-title-line1,.main-title-line2,.main-title-line3,.title,.header-title,.quote-text,.hero-num').forEach(e=>e.style.fontSize=this.value+'px')">
  </div>
  <div class="tool-group">
    <label>间距 <span id="pd-val">28</span></label>
    <input type="range" id="ctl-pad" min="12" max="44" value="28" oninput="document.getElementById('pd-val').textContent=this.value;document.querySelector('.canvas').style.padding=this.value+'px'">
  </div>
  <button onclick="exportPNG()">📥 导出PNG</button>
</div>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
function exportPNG(){
  const tb=document.getElementById('toolbar');
  tb.style.display='none';
  html2canvas(document.querySelector('.canvas'),{scale:3,useCORS:true,backgroundColor:null}).then(c=>{
    tb.style.display='flex';
    const a=document.createElement('a');
    a.download='cover-'+Date.now()+'.png';
    a.href=c.toDataURL('image/png');
    a.click();
  }).catch(()=>{tb.style.display='flex';alert('导出失败，请重试');});
}
</script>

</body>
</html>
