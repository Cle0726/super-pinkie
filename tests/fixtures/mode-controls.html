<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><base href="/ui/assets/">
<title>四模式玻璃按键验收</title>
<link rel="stylesheet" href="/ui/injections/laolao-theme.css">
<link rel="stylesheet" href="/ui/injections/laolao-sidebar.css">
<style>
body{font:14px -apple-system,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#e0d9ea,#f5dae5,#eed6c6)!important}
.fixture{padding:45px;display:flex;gap:55px;align-items:start}.sidebar-brand__identity{min-height:260px}
.controls{display:flex;flex-direction:column;gap:18px;margin-top:20px}.controls button{padding:10px 18px;border:1px solid transparent;border-radius:13px;font:inherit;cursor:pointer}
textarea{padding:16px;border-radius:15px;border:1px solid #fff;background:#fff9fc70;font:inherit}
.chat-workspace-rail{height:340px;width:38px;display:flex;flex-direction:column}
</style></head><body><div class="fixture"><div class="sidebar-brand__identity"></div>
<div class="controls"><button class="sidebar-new-session">＋ 新会话</button><button class="agent-chat__suggestion">一起想个好点子</button><button class="chat-settings-chip">聊天设置</button><button class="chat-send-btn">发送消息</button><button class="chat-send-btn chat-send-btn--laolao-dictation is-recording">正在录音</button><button class="chat-send-btn" disabled>暂不可发送</button><textarea aria-label="输入测试" placeholder="验证选择、输入、复制不受影响"></textarea></div>
<section class="sidebar" aria-label="会话条目验收"><button class="sidebar-recent-session">普通会话条目</button><button class="sidebar-recent-session sidebar-recent-session--active">当前选中会话</button></section>
<aside class="chat-workspace-rail chat-workspace-rail--collapsed"></aside></div>
<script src="/ui/injections/laolao-motion.js"></script><script src="/ui/injections/laolao-mode-switcher.js"></script><script src="/ui/injections/laolao-party-entry.js"></script>
<!-- Production copies entry script and art into one directory; this fixture
     serves the repository layout, so only its preview URL needs adjustment. -->
<script>document.querySelector('#pinkie-party-entry img').src='/ui/assets/laolao-party-avatar-v1.png';</script>
</body></html>
