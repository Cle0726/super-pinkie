<!doctype html><meta charset="utf-8"><title>电子信息控件验收</title><style>body{font:15px/1.6 system-ui;margin:0;background:#f5f3f6;color:#483f50}main{max-width:720px;margin:32px auto;padding:28px;background:#fff;border:1px solid #e5dce8;border-radius:20px}h1{font-size:20px;margin:0}small{color:#928695}label{display:block;margin:22px 0}select,input[type=text]{display:block;border:1px solid #d6cadc;border-radius:9px;padding:10px;width:320px;background:#fcfafc}input[type=range]{display:block;width:320px;margin-top:10px;accent-color:#ad7ba6}button{padding:10px 20px;border:0;border-radius:10px;color:white;background:#9f739e}output{color:#8d638d}#status{margin-top:18px}</style><main><h1>电子信息参数表</h1><small>独立端口测试页 · 不连接真实业务</small><label>课程<select id="course" aria-label="课程"><option value="analog">模拟电路</option><option value="digital">数字电路</option></select></label><label>频率 <output id="freq">20</output><input id="frequency" aria-label="频率" type="range" min="0" max="100" step="1" value="20"></label><label>备注<input id="note" aria-label="备注" type="text"></label><button id="save">保存参数</button><div id="status" role="status">尚未保存</div></main><script>window.qa={saves:0};frequency.oninput=e=>{freq.value=frequency.value;qa.sliderTrusted=e.isTrusted};save.onclick=e=>{qa.saves++;qa.result={course:course.value,frequency:Number(frequency.value),note:note.value};qa.saveTrusted=e.isTrusted;document.querySelector('#status').textContent='保存完成，已保存'+qa.saves+'次；课程'+course.options[course.selectedIndex].text+'，频率'+frequency.value+'，备注'+note.value};</script>
