<!doctype html><meta charset="utf-8"><title>碧琪鼠标 · 样式预览</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f4f1f3;color:#594a57;font:13px/1.6 system-ui}main{max-width:720px;margin:auto}h1{font-size:15px;font-weight:550;margin:0 0 5px}p{margin:0;color:#8e7d89;font-size:12px}.samples{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.sample{height:210px;padding:16px;border:1px solid #e8dfe6;border-radius:19px;background:linear-gradient(135deg,#fffcfa,#f9edf3);position:relative;overflow:hidden}.night{background:linear-gradient(135deg,#28212e,#1e1926);border-color:#443847;color:#d6c8dc}.tag{font-size:11px;opacity:.6}.stage{position:absolute;inset:66px 35px 35px;display:flex;align-items:center;justify-content:center}.field{height:36px;width:145px;border:1px solid #e5cddc;border-radius:11px;background:#fffbfd;box-shadow:0 3px 9px #a46c8908;color:#9e7c93;display:grid;place-items:center;font-size:11px}.night .field{background:#302638;border-color:#54425c;color:#c6b1ce}.cursor{position:absolute;width:15px;height:19px;left:calc(50% + 21px);top:47%;filter:drop-shadow(0 1px 1px #3b22332c)}.cursor path{fill:#fff9fc;stroke:#bd8ca7;stroke-width:.8;stroke-linejoin:round}.night .cursor path{fill:#f7efff;stroke:#b69bca}.ripple{position:absolute;width:12px;height:12px;border:1px solid #bd8ca77d;border-radius:50%;left:calc(50% + 21px);top:47%;transform:translate(-50%,-50%);opacity:0;animation:click 3.8s infinite}.night .ripple{border-color:#c7a5e6a0}.cursor{animation:travel 3.8s cubic-bezier(.25,.6,.25,1) infinite}.detail{margin-top:15px;font-size:11px;color:#998995}.legend{display:flex;gap:20px;margin-top:20px;font-size:12px;color:#8d7b89}@keyframes click{0%,35%,100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}39%{opacity:.6;transform:translate(-50%,-50%) scale(.7)}51%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}@keyframes travel{0%,12%{transform:translate(-42px,15px)}34%,70%{transform:translate(0,0)}95%,100%{transform:translate(-42px,15px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:560px){.samples{grid-template-columns:1fr}body{padding:18px}}
</style><main><h1>碧琪鼠标 · 样式预览</h1><p>独立的控件样式演示，不是 App 窗口。鼠标实际高度 18px。</p><div class="samples"><section class="sample"><div class="tag">白天</div><div class="stage"><div class="field">轻触反馈</div><i class="ripple"></i><svg class="cursor" viewBox="0 0 15 19"><path d="M1 0 1.5 15.5 5.5 11.8 8.8 18 11.1 16.7 7.9 10.7 14.2 10.6Z"/></svg></div></section><section class="sample night"><div class="tag">夜晚</div><div class="stage"><div class="field">轻触反馈</div><i class="ripple"></i><svg class="cursor" viewBox="0 0 15 19"><path d="M1 0 1.5 15.5 5.5 11.8 8.8 18 11.1 16.7 7.9 10.7 14.2 10.6Z"/></svg></div></section></div><div class="legend"><span>细描边</span><span>轻阴影</span><span>单次点击涟漪</span><span>无常驻目标框</span></div></main>
