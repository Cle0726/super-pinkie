<!doctype html><meta charset="utf-8"><title>长表格定位验收</title><style>body{font:15px/1.5 system-ui;margin:0;background:#f5f3f6;color:#483f50}main{max-width:760px;margin:30px auto;padding:24px;background:#fff;border:1px solid #e4dce7;border-radius:20px}h1{font-size:20px}#table{height:330px;overflow:auto;border:1px solid #e5dce8;border-radius:12px;margin-top:22px}.row{display:flex;align-items:center;gap:20px;min-height:64px;padding:10px 18px;border-bottom:1px solid #eee6f0}.row input{width:130px;border:1px solid #d6c6dd;border-radius:7px;padding:8px}.row button{border:0;border-radius:7px;padding:8px;background:#ad83ae;color:white}small{color:#938297}</style><main><h1>电子信息参数表</h1><small>共有60项，表格内部滚动；整个页面保持原位</small><div id="table" tabindex="0" role="region" aria-label="参数表"></div><p id="status" role="status">尚未保存</p></main><script>window.qa={saves:0};for(let i=1;i<=60;i++){const row=document.createElement('div');row.className='row';row.innerHTML='<span>第'+i+'项</span><input aria-label="第'+i+'项参数" value="0"><button aria-label="保存第'+i+'项">保存</button>';row.querySelector('button').onclick=e=>{qa.saves++;qa.item=i;qa.value=row.querySelector('input').value;qa.pageScrollY=scrollY;qa.tableScroll=document.querySelector('#table').scrollTop;document.querySelector('#status').textContent='已保存第'+i+'项，参数'+qa.value+'，共保存'+qa.saves+'次'};document.querySelector('#table').append(row)}</script>
