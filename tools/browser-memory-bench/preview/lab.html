<!doctype html><meta charset="utf-8"><title>悬停与画布验收</title><style>body{font:15px/1.6 system-ui;margin:0;background:#f5f3f6;color:#483f50}main{max-width:780px;margin:30px auto;padding:25px;background:white;border:1px solid #e4dce7;border-radius:20px}h1{font-size:20px}#menu{width:160px;height:95px;padding:10px;border:1px solid #d8cadd;border-radius:12px;background:#faf5fb}#menu button{display:none;margin-top:8px}#menu:hover button{display:block}button{padding:9px 15px;border:0;border-radius:9px;background:#aa7ca7;color:white}#workspace{display:flex;gap:40px;align-items:center;margin:25px 0}canvas{width:360px;height:180px;background:#f7f4fa;border:1px solid #d8cddd;border-radius:12px}#target{width:100px;height:90px;display:grid;place-items:center;border:1px dashed #b6a1bd;border-radius:12px;background:#fbf7fc}#status{margin-top:15px}small{color:#928695}</style><main><h1>电路实验画布</h1><small>独立端口测试页 · 真实鼠标控件验收</small><div id="menu" role="button" aria-label="高级实验">高级实验<button id="enter">打开画布</button></div><section id="lab" hidden><div id="workspace"><canvas id="board" width="360" height="180" role="button" aria-label="实验画布，中心有一个节点"></canvas><div id="target" role="button" aria-label="目标区">目标区</div></div><button id="check">检查结果</button><div id="status" role="status">节点尚未对齐</div></section></main><script>window.qa={opened:false,aligned:false,moves:0,checks:0};enter.onclick=e=>{qa.opened=true;lab.hidden=false};const b=board,ctx=b.getContext('2d');ctx.fillStyle='#b28cb9';ctx.beginPath();ctx.arc(180,90,14,0,Math.PI*2);ctx.fill();b.onpointerdown=e=>{qa.down=true;qa.trusted=e.isTrusted;b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(qa.down)qa.moves++};b.onpointerup=e=>{qa.down=false;const r=target.getBoundingClientRect();qa.aligned=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;document.querySelector('#status').textContent=qa.aligned?'节点已对齐目标区':'节点尚未对齐'};check.onclick=e=>{qa.checks++;qa.checkTrusted=e.isTrusted;document.querySelector('#status').textContent=qa.aligned?'检查通过：节点已对齐目标区':'检查未通过：节点尚未对齐'};</script>
